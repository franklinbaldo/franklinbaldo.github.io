# SSG 0.0.68 native preview. The public Pages workflow remains on Zola
# until the native candidate passes complete route and behaviour parity.
site_name = "franklinbaldo"
site_title = "Franklin Baldo"
site_description = "Essays, code and research in AI, philosophy and literature."
base_url = "https://franklinbaldo.github.io"
language = "en"
content_dir = ".cache/ssg-native/content"
output_dir = "dist-ssg"
template_dir = "ssg/templates"

[i18n]
default_locale = "en"
locales = ["en", "pt"]
url_prefix = "sub_path"

[[listings]]
name = "archive"
title = "Archive"
per_page = 50
language = "en"

# SSG 0.0.68 has a sidecar promotion bug in PaginationPlugin::after_compile.
# Until the native plugin is repaired upstream, scripts/ssg/archive.mjs
# projects these routes to Markdown and SSG renders them normally.
[[listings]]
name = "pt/archive"
title = "Arquivo"
per_page = 50
language = "pt"
