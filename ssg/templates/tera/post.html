{% extends "base.html" %}
{% block content %}
<article class="reading-page">
  <header><h1>{{ page.title }}</h1>
  {% if page.date %}<time datetime="{{ page.date }}">{{ page.date }}</time>{% endif %}
  {% if page.description %}<p class="tagline">{{ page.description }}</p>{% endif %}</header>
  <div class="prose">{{ page.content | safe }}</div>
  <nav aria-label="Article navigation"><a href="/archive/">← Archive</a></nav>
</article>
{% endblock %}
