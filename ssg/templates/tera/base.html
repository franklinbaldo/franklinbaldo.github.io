<!doctype html>
<html lang="{% if page is defined and page.language is defined %}{{ page.language }}{% else %}en{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page is defined and page.title is defined %}{{ page.title }} · {% endif %}Franklin Baldo</title>
  <meta name="description" content="{% if page is defined and page.description is defined %}{{ page.description }}{% else %}Essays, code and research.{% endif %}">
  <link rel="stylesheet" href="/ssg-preview.css">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content / Pular para conteúdo</a>
  <header class="site-header">
    <nav aria-label="Primary / Principal">
      <a href="/">Franklin Baldo</a>
      <a href="/archive/">Archive</a>
      <a href="{% if page is defined and page.language is defined and page.language == 'pt' %}/pt/projects/{% else %}/projects/{% endif %}">{% if page is defined and page.language is defined and page.language == 'pt' %}Projetos{% else %}Projects{% endif %}</a>
      <a href="/pt/">Português</a>
      <a href="/topics/">Topics</a>
    </nav>
    <!-- ssg:lang-switcher -->
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">© Franklin Baldo · <a href="/rss.xml">RSS</a></footer>
</body>
</html>
