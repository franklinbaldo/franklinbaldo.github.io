name: Format FlyDoom Fourier

on:
  push:
    branches:
      - fix/flydoom-fourier-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/flydoom-fourier-prettier
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format FlyDoom Fourier files
        run: >-
          npx prettier --write
          public/flydoom-fourier/index.html
          src/content/blog/flydoom-fourier-uma-mosca-remodelando-o-ambiente.mdx
          changelog/changes/flydoom-fourier-shape-control.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flydoom-fourier/index.html src/content/blog/flydoom-fourier-uma-mosca-remodelando-o-ambiente.mdx changelog/changes/flydoom-fourier-shape-control.md
          git commit -m "style: format FlyDoom Fourier files"
          git push origin HEAD:fix/flydoom-fourier-prettier
