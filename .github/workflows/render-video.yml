name: Render Pattern Over Stuff Video

on:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        working-directory: remotion
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Render video
        working-directory: remotion
        run: npx remotion render src/index.ts PatternOverStuff out.mp4
        env:
          REMOTION_CHROME_FLAGS: "--no-sandbox"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: videos-latest
          name: "Videos — Latest Render"
          body: "Vídeos renderizados automaticamente pelo Remotion."
          files: remotion/out.mp4
          make_latest: true
