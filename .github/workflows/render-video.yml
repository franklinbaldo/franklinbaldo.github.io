name: Render Pattern Over Stuff Video

on:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        working-directory: remotion
        run: npm ci

      - name: Install Chrome for Remotion
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render video
        working-directory: remotion
        run: npx remotion render src/index.ts PatternOverStuff out.mp4
        env:
          REMOTION_CHROME_FLAGS: "--no-sandbox"

      - name: Move video to public folder
        run: mkdir -p public/videos && mv remotion/out.mp4 public/videos/pattern-over-stuff.mp4

      - name: Commit rendered video (without LFS)
        run: |
          git config user.name "Cinelasta [bot]"
          git config user.email "franklinbaldo@users.noreply.github.com"
          # Ensure mp4 is NOT tracked by LFS
          git lfs untrack "*.mp4" 2>/dev/null || true
          git add .gitattributes
          git add --force public/videos/pattern-over-stuff.mp4
          git diff --cached --quiet || git commit -m "chore(cinelasta): render Pattern Over Stuff video"
          git push

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
