name: MaleCNS Direct-Gaze Dyad Kaggle Status

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-direct-gaze-dyad-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malecns-direct-gaze-dyad-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Snapshot public dyad kernel status and logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KERNEL_ID: ${{ vars.KAGGLE_MALECNS_DYAD_KERNEL_ID }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" ]] || exit 2
          [[ -n "$KAGGLE_USERNAME" ]] || exit 2
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'
          KERNEL="${KERNEL_ID:-${KAGGLE_USERNAME}/malecns-direct-gaze-dyad}"
          echo "kernel=$KERNEL"
          date -u '+checked_at=%Y-%m-%dT%H:%M:%SZ'
          kaggle kernels status "$KERNEL" || true
          echo "----- Kaggle execution log snapshot -----"
          kaggle kernels logs "$KERNEL" || true
