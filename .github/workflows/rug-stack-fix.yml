name: Rug stack fix

on:
  push:
    branches:
      - game/rug-pull-engine
    paths:
      - .github/workflows/rug-stack-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/rug-pull-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix starting portfolio and cost basis
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/rug-pull/engine.ts')
          text = path.read_text()

          old = '    state.player.costBasis += spend;\n'
          assert text.count(old) == 1
          text = text.replace(old, '')

          old = '      cash: 250,\n'
          assert text.count(old) == 1
          text = text.replace(old, '      cash: 0,\n')

          path.write_text(text)
          PY
      - name: Format engine slice
        run: npx prettier --write src/rug-pull/engine.ts src/rug-pull/__tests__/engine.test.ts
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rug-pull/engine.ts src/rug-pull/__tests__/engine.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(game): align initial portfolio and format engine"
          git push origin HEAD:game/rug-pull-engine
