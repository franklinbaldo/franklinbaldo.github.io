name: FlyDoom retina materialize

on:
  push:
    branches:
      - feature/flydoom-sensory-motor-truth
    paths:
      - scripts/integrate_flydoom_retina.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flydoom-sensory-motor-truth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize pinned retina geometry
        run: |
          python scripts/vendor_flydoom_retina.py
          sha256sum public/flydoom/retinotopic_columns_1771.json
      - name: Integrate retina HUD into live page
        run: python scripts/integrate_flydoom_retina.py
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flydoom/retinotopic_columns_1771.json public/flydoom/index.html
          git diff --cached --check
          git commit -m "feat(flydoom): integrate compound-eye reconstruction" || exit 0
          git push origin HEAD:feature/flydoom-sensory-motor-truth
