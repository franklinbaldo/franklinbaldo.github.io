name: FlyMirror format

on:
  push:
    branches:
      - demo/flymirror-self-body
    paths:
      - public/flymirror/index.html
      - changelog/changes/flymirror-malecns-morphogenesis.md
      - .github/workflows/flymirror-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format FlyMirror files with repository Prettier
        run: npx prettier --write public/flymirror/index.html changelog/changes/flymirror-malecns-morphogenesis.md
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flymirror/index.html changelog/changes/flymirror-malecns-morphogenesis.md
          git commit -m "style(flymirror): format demo"
          git push origin HEAD:demo/flymirror-self-body
