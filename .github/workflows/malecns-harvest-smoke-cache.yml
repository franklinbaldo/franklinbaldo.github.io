name: MaleCNS Harvest Smoke Cache

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-harvest-smoke-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Configure Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'
      - name: Download completed smoke outputs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/kaggle-output"
          kaggle kernels output "${KAGGLE_USERNAME}/malecns-telemetry-smoke-64x64" -p "$RUNNER_TEMP/kaggle-output" -o
          echo '=== downloaded files ==='
          find "$RUNNER_TEMP/kaggle-output" -type f -printf '%s %p\n' | sort -nr | head -100
          echo '=== likely reusable runtime artifacts ==='
          find "$RUNNER_TEMP/kaggle-output" -type f \( -name 'graph.npz' -o -name 'visual-interface.npz' -o -name 'screen-geometry.npz' -o -name 'manifest.json' -o -name '*summary*.json' \) -printf '%s %p\n' | sort -nr
      - name: Pack reusable cache
        run: |
          set -euxo pipefail
          CACHE="$RUNNER_TEMP/runtime-cache"
          mkdir -p "$CACHE"
          for name in graph.npz visual-interface.npz screen-geometry.npz; do
            src="$(find "$RUNNER_TEMP/kaggle-output" -type f -name "$name" -print -quit)"
            if [[ -n "$src" ]]; then cp "$src" "$CACHE/$name"; fi
          done
          find "$CACHE" -type f -printf '%s %p\n'
          test -f "$CACHE/graph.npz"
          test -f "$CACHE/visual-interface.npz"
          test -f "$CACHE/screen-geometry.npz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malecns-runtime-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-cache/
          if-no-files-found: error
          retention-days: 30
