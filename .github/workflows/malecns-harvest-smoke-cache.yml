name: MaleCNS Harvest Smoke Cache

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-harvest-smoke-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Configure Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'
      - name: Download completed cached smoke outputs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/kaggle-output"
          kaggle kernels output "${KAGGLE_USERNAME}/malecns-cached-telemetry-smoke-64x64" -p "$RUNNER_TEMP/kaggle-output" -o
          echo '=== downloaded files ==='
          find "$RUNNER_TEMP/kaggle-output" -type f -printf '%s %p\n' | sort -nr | head -100
          echo '=== summaries ==='
          while IFS= read -r f; do
            echo "--- $f ---"
            cat "$f"
            echo
          done < <(find "$RUNNER_TEMP/kaggle-output" -type f \( -name '*summary*.json' -o -name '*heartbeat*.jsonl' \) | sort)
      - name: Pack harvested evidence
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/harvest"
          mkdir -p "$OUT"
          find "$RUNNER_TEMP/kaggle-output" -type f \( -name '*summary*.json' -o -name '*heartbeat*.jsonl' -o -name 'graph.npz' -o -name 'visual-interface.npz' -o -name 'screen-geometry.npz' \) -exec cp -t "$OUT" {} +
          find "$OUT" -type f -printf '%s %p\n' | sort -nr
          test -n "$(find "$OUT" -type f -name '*summary*.json' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malecns-cached-smoke-harvest-${{ github.run_id }}
          path: ${{ runner.temp }}/harvest/
          if-no-files-found: error
          retention-days: 30
