name: Tier evidence artifact

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tier-evidence-artifact.yml"
      - ".routines/hronir/**"
      - "knowledge/blog-post-tiers/**"
      - "src/hronir/**"
      - "package.json"
      - "package-lock.json"

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Project tier evidence
        run: npm run hronir:tier-evidence -- --limit 25 | tee tier-evidence.txt

      - name: Upload tier evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hronir-tier-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tier-evidence.txt
          retention-days: 7
