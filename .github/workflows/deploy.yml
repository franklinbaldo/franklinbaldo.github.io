name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # RFC 0015: prebuild runs hronir:select, and a flattened slug's
      # history (blobs for folded-back/pruned versions) is resolved via
      # git plumbing — a shallow clone would silently fail to find them.
      # This workflow already builds the site (and therefore already runs
      # hronir:select through the `prebuild` npm hook), so it needs full
      # history regardless of whether any slug is flat yet.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Astro build state
        uses: actions/cache@v4
        with:
          path: .astro
          key: ${{ runner.os }}-astro-v24-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-v24-
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
