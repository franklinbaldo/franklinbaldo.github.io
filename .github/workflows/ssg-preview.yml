name: SSG native built-ins candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "ssg/**"
      - "scripts/ssg/**"
      - "scripts/lib/**"
      - "scripts/pregen.mjs"
      - "public/**"
      - "src/generated/**"
      - "package.json"
      - "src/content/blog/**"
      - "src/generated/versions-selected.json"
      - "docs/migrations/ssg.md"
      - ".github/workflows/ssg-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test SSG projection, routes and architecture
        run: npm run test:ssg

      - name: Install official SHA-256 pinned SSG v0.0.75
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://github.com/sebastienrousseau/static-site-generator/releases/download/v0.0.75/ssg-v0.0.75-x86_64-unknown-linux-musl.tar.gz" --output "$RUNNER_TEMP/ssg.tar.gz"
          echo "2fedae111f8cb9a18c38a42c3f4f2ad70a3fd1222ad34dd849ba2a993341f6e3  $RUNNER_TEMP/ssg.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ssg-bin"
          tar -xzf "$RUNNER_TEMP/ssg.tar.gz" -C "$RUNNER_TEMP/ssg-bin"
          echo "$RUNNER_TEMP/ssg-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ssg-bin/ssg" --version

      - name: Build SSG native candidate and verify projected routes
        run: npm run build:ssg

      - name: Install pinned Zola reference generator
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/zola.tar.gz"
          echo "7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zola-bin"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola-bin"
          echo "$RUNNER_TEMP/zola-bin" >> "$GITHUB_PATH"
      - name: Build full Zola reference (all domains and applications)
        run: npm run build:zola
      - name: Compare full published Zola artifact against SSG
        run: node scripts/ssg/compare-baseline.mjs
      - name: Verify canonical article title, language and rendered body
        run: node scripts/ssg/article-parity.mjs
      - name: Collect SSG native audits (non-blocking while parity is incomplete)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          ssg audit --output dist-ssg --sarif > .cache/ssg-native/ssg-audit.sarif
      - name: Upload native SSG preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssg-preview
          path: dist-ssg/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload projection and parity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssg-candidate-evidence
          path: |
            .cache/ssg-native/manifest.json
            .cache/ssg-native/parity.json
            .cache/ssg-native/asset-report.json
            .cache/ssg-native/ssg-audit.sarif
            .cache/ssg-native/full-parity.json
            .cache/ssg-native/quality-summary.json
            .cache/ssg-native/article-parity.json
            .cache/ssg-native/redirects.json
            .cache/ssg-native/redirect-validation.json
            .cache/ssg-native/archive-report.json
          if-no-files-found: warn
          retention-days: 14
