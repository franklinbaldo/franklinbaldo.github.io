name: FlyDoom wire macro runtime

on:
  push:
    branches:
      - feature/flydoom-neural-viewport
    paths:
      - "scripts/patch_flydoom_macro_runtime.py"
      - ".github/workflows/flydoom-runtime-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/flydoom-neural-viewport
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic runtime patch
        run: python scripts/patch_flydoom_macro_runtime.py
      - name: Format Phase 2A files
        run: npx prettier --write public/flydoom/index.html public/flydoom/neural_viewport.js public/flydoom/NEURAL-TELEMETRY.md
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flydoom/index.html public/flydoom/neural_viewport.js public/flydoom/NEURAL-TELEMETRY.md
          if git diff --cached --quiet; then
            echo "Runtime patch already applied and formatted."
            exit 0
          fi
          git commit -m "feat(flydoom): wire macro telemetry into compact runtime"
          git push origin HEAD:feature/flydoom-neural-viewport
