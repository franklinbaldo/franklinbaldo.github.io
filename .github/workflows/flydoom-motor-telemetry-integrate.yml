name: FlyDoom motor telemetry integrate

on:
  push:
    branches:
      - feature/flydoom-motor-telemetry
    paths:
      - scripts/integrate_flydoom_motor_telemetry.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/flydoom-motor-telemetry
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply motor telemetry patch
        run: python scripts/integrate_flydoom_motor_telemetry.py
      - name: Format live page
        run: npx prettier --write public/flydoom/index.html
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flydoom/index.html
          git diff --cached --check
          git commit -m "feat(flydoom): expose motor truth telemetry" || exit 0
          git push origin HEAD:feature/flydoom-motor-telemetry
