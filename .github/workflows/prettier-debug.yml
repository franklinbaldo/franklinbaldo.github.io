name: Prettier debug

on:
  pull_request:
    branches: [main]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format experiment JavaScript
        run: npx prettier --write public/experimentos/dobra-sem-vinco/app.js

      - name: Upload runner-formatted JavaScript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-formatted-app-js
          path: public/experimentos/dobra-sem-vinco/app.js
          if-no-files-found: error
          retention-days: 1
