name: CausaGanha Segmenter GPU

on:
  push:
    branches:
      - feat/causaganha-segmenter-gpu-runner
    paths:
      - .github/workflows/causaganha-segmenter-gpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: causaganha-segmenter-gpu
  cancel-in-progress: false

jobs:
  drain:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Manual drain only; push-triggered duplicate does not dispatch GPU."
