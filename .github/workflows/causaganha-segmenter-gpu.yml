name: CausaGanha Segmenter GPU

on:
  # The feature-branch push trigger exists so the runner can prove itself before
  # merge. Once merged, normal operation is workflow_dispatch.
  push:
    branches:
      - feat/causaganha-segmenter-gpu-runner
    paths:
      - .github/workflows/causaganha-segmenter-gpu.yml
      - scripts/ml/causaganha-segmenter-worker.py
      - scripts/ml/runners/kaggle-causaganha-segmenter.sh
      - scripts/ml/runners/colab-causaganha-segmenter.sh
  workflow_dispatch:
    inputs:
      runner:
        description: Remote GPU provider
        required: true
        default: kaggle
        type: choice
        options:
          - kaggle
          - colab
      causaganha_ref:
        description: CausaGanha branch, tag, or commit to train
        required: true
        default: main
        type: string
      data_dir:
        description: CausaGanha directory containing train.jsonl, val.jsonl and label_space.json
        required: true
        default: data/segmenter_splits
        type: string
      epochs:
        description: Training epochs; checkpoint selection uses validation only
        required: true
        default: "3"
        type: string
      batch_size:
        description: OPF training batch size
        required: true
        default: "1"
        type: string
      seed:
        description: Shuffle seed
        required: true
        default: "771"
        type: string
      accelerator:
        description: NvidiaTeslaT4 on Kaggle; T4 on Colab; blank uses provider default
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: causaganha-segmenter-gpu
  cancel-in-progress: false

jobs:
  train:
    name: Exploratory OPF train+val on remote GPU
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROVIDER: ${{ inputs.runner || 'kaggle' }}
      CAUSAGANHA_REF: ${{ inputs.causaganha_ref || 'main' }}
      DATA_DIR: ${{ inputs.data_dir || 'data/segmenter_splits' }}
      EPOCHS: ${{ inputs.epochs || '1' }}
      BATCH_SIZE: ${{ inputs.batch_size || '1' }}
      SEED: ${{ inputs.seed || '771' }}
      REQUESTED_ACCELERATOR: ${{ inputs.accelerator || '' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Explain experiment boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## CausaGanha OPF segmenter — exploratory GPU run

          - provider: \`$PROVIDER\`
          - CausaGanha ref: \`$CAUSAGANHA_REF\`
          - source data: \`$DATA_DIR\`
          - epochs: **$EPOCHS**
          - batch size: **$BATCH_SIZE**
          - seed: **$SEED**
          - **locked test is not copied to the remote training workspace and is not evaluated**

          This run exists to exercise fine-tuning and expose training/validation failures. It does not promote a production model or consume the final evaluation set.
          EOF

      - name: Configure Kaggle CLI
        if: env.PROVIDER == 'kaggle'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" ]] || { echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2; exit 2; }
          [[ -n "$KAGGLE_USERNAME" ]] || { echo "Missing GitHub variable KAGGLE_USERNAME" >&2; exit 2; }
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'

      - name: Train on Kaggle T4
        if: env.PROVIDER == 'kaggle'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          ACCELERATOR="${REQUESTED_ACCELERATOR:-NvidiaTeslaT4}"
          bash scripts/ml/runners/kaggle-causaganha-segmenter.sh \
            --ref "$CAUSAGANHA_REF" \
            --data-dir "$DATA_DIR" \
            --epochs "$EPOCHS" \
            --batch-size "$BATCH_SIZE" \
            --seed "$SEED" \
            --accelerator "$ACCELERATOR" \
            --report-output "$RUNNER_TEMP/segmenter-report.zip"

      - name: Configure Colab CLI
        if: env.PROVIDER == 'colab'
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'google-colab-cli==0.6.0' 'jupyter-kernel-client==0.9.0'
          if [[ -n "$COLAB_TOKEN_JSON" ]]; then
            install -d -m 700 "$HOME/.config/colab-cli"
            printf '%s' "$COLAB_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
            chmod 600 "$HOME/.config/colab-cli/token.json"
            echo "COLAB_AUTH_PROVIDER=oauth2" >> "$GITHUB_ENV"
          elif [[ -n "$COLAB_ADC_JSON" ]]; then
            printf '%s' "$COLAB_ADC_JSON" > "$RUNNER_TEMP/colab-adc.json"
            chmod 600 "$RUNNER_TEMP/colab-adc.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/colab-adc.json" >> "$GITHUB_ENV"
            echo "COLAB_AUTH_PROVIDER=adc" >> "$GITHUB_ENV"
          else
            echo "Missing GitHub secret COLAB_TOKEN_JSON (or COLAB_ADC_JSON)" >&2
            exit 2
          fi

      - name: Train on Colab T4
        if: env.PROVIDER == 'colab'
        run: |
          set -euo pipefail
          GPU="${REQUESTED_ACCELERATOR:-T4}"
          bash scripts/ml/runners/colab-causaganha-segmenter.sh \
            --ref "$CAUSAGANHA_REF" \
            --data-dir "$DATA_DIR" \
            --epochs "$EPOCHS" \
            --batch-size "$BATCH_SIZE" \
            --seed "$SEED" \
            --gpu "$GPU" \
            --report-output "$RUNNER_TEMP/segmenter-report.zip" \
            --model-output "$RUNNER_TEMP/segmenter-model.tar.gz"

      - name: Inspect remote report
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/segmenter-report.zip" ]]; then
            echo "No segmenter report was recovered from the remote provider." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/segmenter-report"
          mkdir -p "$RUNNER_TEMP/segmenter-report"
          unzip -q "$RUNNER_TEMP/segmenter-report.zip" -d "$RUNNER_TEMP/segmenter-report"
          python - "$RUNNER_TEMP/segmenter-report/run-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("\n### Remote result")
          print(f"- status: **{summary.get('status')}**")
          print(f"- resolved CausaGanha SHA: `{summary.get('resolved_sha', 'unknown')}`")
          print(f"- CUDA: `{summary.get('cuda_device', summary.get('hardware', {}).get('nvidia_smi', 'unknown'))}`")
          print(f"- duration: **{summary.get('duration_seconds', 'unknown')} s**")
          print(f"- locked test consumed: **{summary.get('locked_test_consumed')}**")
          manifest = summary.get("experiment_manifest") or {}
          selection = manifest.get("checkpoint_selection") or {}
          if selection:
              print(f"- selected epoch: **{selection.get('selected_epoch')}**")
              print(f"- validation macro-F1: **{selection.get('val_macro_f1')}**")
          if summary.get("error"):
              print(f"- error: `{summary['error']}`")
          PY

      - name: Upload compact training evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: causaganha-segmenter-report-${{ env.PROVIDER }}
          path: |
            ${{ runner.temp }}/segmenter-report.zip
            ${{ runner.temp }}/segmenter-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Colab model archive
        if: env.PROVIDER == 'colab'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: causaganha-segmenter-model-colab
          path: ${{ runner.temp }}/segmenter-model.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Kaggle model persistence note
        if: env.PROVIDER == 'kaggle'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The full model archive is kept in the private Kaggle kernel output as \`segmenter-model.tar.gz\`; Actions downloads only the compact report to avoid moving multi-GB checkpoints through GitHub artifact storage." >> "$GITHUB_STEP_SUMMARY"
