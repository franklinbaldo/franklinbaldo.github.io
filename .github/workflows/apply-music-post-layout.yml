name: Apply music post layout

on:
  push:
    branches:
      - design/music-post-layout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/music-post-layout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply dedicated music layout
        shell: python
        run: |
          from pathlib import Path
          import re

          component = r'''---
          interface Track {
            label: string;
            sunoId: string;
            sunoImageUrl?: string;
            genre?: string[];
            duration?: number;
          }

          interface Props {
            title: string;
            description?: string;
            date: Date;
            locale: string;
            lang: string;
            tracks: Track[];
            rankHref?: string;
            rankLabel?: string;
            rankTitle?: string;
          }

          const {
            title,
            description,
            date,
            locale,
            lang,
            tracks,
            rankHref,
            rankLabel,
            rankTitle,
          } = Astro.props;

          const primary = tracks[0];
          const cover = primary?.sunoImageUrl || (primary ? `https://cdn2.suno.ai/${primary.sunoId}_image.jpeg` : undefined);
          const copy = lang === "pt"
            ? {
                eyebrow: "Canção",
                play: "Ouvir agora",
                playAria: "Reproduzir",
                variants: "Versões desta composição",
                onSuno: "Abrir no Suno",
                coverAlt: "Capa de",
              }
            : {
                eyebrow: "Song",
                play: "Listen now",
                playAria: "Play",
                variants: "Versions of this composition",
                onSuno: "Open on Suno",
                coverAlt: "Cover for",
              };

          const formatDuration = (seconds?: number) =>
            seconds ? `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}` : undefined;
          ---

          <section class="music-post-layout">
            <header class="music-post-hero">
              {cover && (
                <div class="music-post-artwork">
                  <img src={cover} alt={`${copy.coverAlt} ${title}`} width="640" height="640" loading="eager" fetchpriority="high" />
                  {primary && (
                    <button
                      class="music-play-btn music-cover-play"
                      type="button"
                      data-suno-id={primary.sunoId}
                      data-suno-title={primary.label}
                      aria-label={`${copy.playAria} ${primary.label}`}
                    >
                      <span aria-hidden="true">▶</span>
                    </button>
                  )}
                </div>
              )}

              <div class="music-post-intro">
                <p class="music-post-eyebrow">{copy.eyebrow}</p>
                <h1>{title}</h1>
                {description && <p class="music-post-description">{description}</p>}

                <p class="music-post-byline">
                  <time datetime={date.toISOString()}>{date.toLocaleDateString(locale, { year: "numeric", month: "long", day: "numeric" })}</time>
                  {rankHref && rankLabel && <><span aria-hidden="true"> · </span><a href={rankHref} title={rankTitle}>{rankLabel}</a></>}
                </p>

                {primary && (
                  <div class="music-post-actions">
                    <button
                      class="music-play-btn music-primary-action"
                      type="button"
                      data-suno-id={primary.sunoId}
                      data-suno-title={primary.label}
                      aria-label={`${copy.playAria} ${primary.label}`}
                    >
                      <span aria-hidden="true">▶</span> {copy.play}
                    </button>
                    <a href={`https://suno.com/song/${primary.sunoId}`} target="_blank" rel="noopener noreferrer">{copy.onSuno} ↗</a>
                  </div>
                )}

                {primary && (
                  <div class="music-post-meta">
                    {primary.genre?.map((item) => <span>{item}</span>)}
                    {formatDuration(primary.duration) && <span>{formatDuration(primary.duration)}</span>}
                  </div>
                )}
              </div>
            </header>

            {tracks.length > 1 && (
              <section class="music-versions" aria-labelledby="music-versions-title">
                <h2 id="music-versions-title">{copy.variants}</h2>
                <ol>
                  {tracks.map((track, index) => (
                    <li>
                      <button
                        class="music-play-btn music-version-play"
                        type="button"
                        data-suno-id={track.sunoId}
                        data-suno-title={track.label}
                        aria-label={`${copy.playAria} ${track.label}`}
                      >
                        <span class="music-version-number" aria-hidden="true">{String(index + 1).padStart(2, "0")}</span>
                        <span class="music-version-title">{track.label}</span>
                        {formatDuration(track.duration) && <span class="music-version-duration">{formatDuration(track.duration)}</span>}
                        <span aria-hidden="true">▶</span>
                      </button>
                    </li>
                  ))}
                </ol>
              </section>
            )}

            <div class="music-post-copy">
              <slot />
            </div>
          </section>

          <style>
            .music-post-layout {
              --music-art-size: clamp(15rem, 34vw, 25rem);
              margin-top: 1rem;
            }

            .music-post-hero {
              display: grid;
              grid-template-columns: minmax(14rem, var(--music-art-size)) minmax(0, 1fr);
              gap: clamp(1.5rem, 4vw, 3.5rem);
              align-items: center;
              margin: 0 0 clamp(2.5rem, 7vw, 5rem);
            }

            .music-post-artwork {
              position: relative;
              aspect-ratio: 1;
              overflow: hidden;
              border-radius: 0.4rem;
              background: var(--pico-card-background-color);
              box-shadow: 0 1.4rem 3.5rem rgba(20, 16, 12, 0.18);
            }

            .music-post-artwork img {
              width: 100%;
              height: 100%;
              object-fit: cover;
            }

            .music-cover-play {
              position: absolute;
              right: 1rem;
              bottom: 1rem;
              display: grid;
              place-items: center;
              width: 3.5rem;
              height: 3.5rem;
              padding: 0;
              border: 0;
              border-radius: 50%;
              background: color-mix(in srgb, var(--pico-primary) 92%, black);
              color: var(--pico-primary-inverse);
              box-shadow: 0 0.7rem 1.8rem rgba(0, 0, 0, 0.28);
              cursor: pointer;
            }

            .music-cover-play span {
              transform: translateX(0.08em);
            }

            .music-post-intro h1 {
              max-width: 14ch;
              margin: 0.25rem 0 1rem;
              font-size: clamp(2.4rem, 6vw, 5.4rem);
              line-height: 0.96;
              text-wrap: balance;
            }

            .music-post-eyebrow {
              margin: 0;
              color: var(--pico-primary);
              font-size: 0.75rem;
              font-weight: 700;
              letter-spacing: 0.18em;
              text-transform: uppercase;
            }

            .music-post-description {
              max-width: 42rem;
              margin: 0 0 1rem;
              color: var(--pico-muted-color);
              font-family: var(--pico-font-family-serif);
              font-size: clamp(1rem, 2vw, 1.25rem);
              line-height: 1.55;
            }

            .music-post-byline {
              margin: 0 0 1.5rem;
              color: var(--pico-muted-color);
              font-size: 0.86rem;
            }

            .music-post-actions {
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              gap: 0.9rem 1.2rem;
              margin-bottom: 1rem;
            }

            .music-primary-action {
              display: inline-flex;
              align-items: center;
              gap: 0.55rem;
              width: auto;
              margin: 0;
              padding: 0.7rem 1.1rem;
              border: 0;
              border-radius: 999px;
              background: var(--pico-primary);
              color: var(--pico-primary-inverse);
              font-weight: 700;
              cursor: pointer;
            }

            .music-post-actions a {
              font-size: 0.9rem;
            }

            .music-post-meta {
              display: flex;
              flex-wrap: wrap;
              gap: 0.4rem;
            }

            .music-post-meta span {
              padding: 0.22rem 0.62rem;
              border: 1px solid var(--pico-muted-border-color);
              border-radius: 999px;
              color: var(--pico-muted-color);
              font-size: 0.72rem;
            }

            .music-versions {
              max-width: 52rem;
              margin: -1rem auto 3.5rem;
              padding-top: 1.25rem;
              border-top: 1px solid var(--pico-muted-border-color);
            }

            .music-versions h2 {
              margin-bottom: 0.8rem;
              color: var(--pico-muted-color);
              font-size: 0.76rem;
              letter-spacing: 0.14em;
              text-transform: uppercase;
            }

            .music-versions ol {
              margin: 0;
              padding: 0;
              list-style: none;
            }

            .music-version-play {
              display: grid;
              grid-template-columns: 2.4rem minmax(0, 1fr) auto auto;
              gap: 0.8rem;
              align-items: center;
              width: 100%;
              margin: 0;
              padding: 0.8rem 0;
              border: 0;
              border-bottom: 1px solid var(--pico-muted-border-color);
              border-radius: 0;
              background: transparent;
              color: var(--pico-color);
              text-align: left;
              cursor: pointer;
            }

            .music-version-number,
            .music-version-duration {
              color: var(--pico-muted-color);
              font-variant-numeric: tabular-nums;
              font-size: 0.78rem;
            }

            .music-version-title {
              overflow: hidden;
              font-weight: 600;
              text-overflow: ellipsis;
              white-space: nowrap;
            }

            .music-post-copy {
              max-width: 48rem;
              margin-inline: auto;
            }

            .music-post-copy :global(h2) {
              margin-top: 3.5rem;
              padding-top: 1rem;
              border-top: 1px solid var(--pico-muted-border-color);
            }

            .music-post-copy :global(pre) {
              padding: 0;
              border: 0;
              background: transparent;
              box-shadow: none;
              white-space: pre-wrap;
            }

            .music-post-copy :global(pre code) {
              padding: 0;
              background: transparent;
              color: var(--pico-color);
              font-family: var(--pico-font-family-serif);
              font-size: clamp(1rem, 2vw, 1.15rem);
              line-height: 1.8;
              white-space: pre-wrap;
            }

            @media (max-width: 760px) {
              .music-post-hero {
                grid-template-columns: 1fr;
                gap: 1.4rem;
              }

              .music-post-artwork {
                width: min(100%, 28rem);
                margin-inline: auto;
              }

              .music-post-intro h1 {
                max-width: none;
              }
            }

            @media (prefers-reduced-motion: no-preference) {
              .music-cover-play,
              .music-primary-action,
              .music-version-play {
                transition: transform 150ms ease, opacity 150ms ease;
              }

              .music-cover-play:hover,
              .music-primary-action:hover {
                transform: translateY(-2px);
              }
            }
          </style>
          '''

          Path("src/components/MusicPostLayout.astro").write_text(component, encoding="utf-8")

          files = {
            Path("src/pages/blog/[...slug].astro"): "../../components/MusicPostLayout.astro",
            Path("src/pages/pt/blog/[...slug].astro"): "../../../components/MusicPostLayout.astro",
          }

          replacement = r'''        {postType === 'music' ? (
                    <MusicPostLayout
                      title={title}
                      description={description}
                      date={date}
                      locale={locale}
                      lang={postLang}
                      tracks={allTracks}
                      rankHref={rankInfo ? rankHref : undefined}
                      rankLabel={rankInfo ? `${rankLabel} #${rankInfo.rank}/${rankInfo.total}` : undefined}
                      rankTitle={rankInfo ? `μ ${rankInfo.row.mu.toFixed(2)}, σ ${rankInfo.row.sigma.toFixed(2)}, ${rankInfo.row.wins}/${rankInfo.row.appearances}` : undefined}
                    >
                      {series && <SeriesContext series={series} lang={lang ?? DEFAULT_LANG} variant="aside" />}
                      <Content />
                    </MusicPostLayout>
                  ) : (
                    <>
                      <header>
                        <hgroup>
                          <h1>{title}</h1>
                          <p>
                            <small>
                              <time datetime={date.toISOString()}>{date.toLocaleDateString(locale, dateOpts)}</time>
                              {minutesRead && <> · <span class="reading-badge">{minutesRead} {t(lang, 'post.minutesRead')}</span></>}
                              {showUpdated && lastModified && (
                                <> · {t(lang, 'post.updated')} <time datetime={lastModified.toISOString()}>
                                  {lastModified.toLocaleDateString(locale, dateOpts)}
                                </time></>
                              )}
                              {rankInfo && (
                                <> · <a href={rankHref} title={`μ ${rankInfo.row.mu.toFixed(2)}, σ ${rankInfo.row.sigma.toFixed(2)}, ${rankInfo.row.wins}/${rankInfo.row.appearances}`}>{rankLabel} #{rankInfo.rank}/{rankInfo.total}</a></>
                              )}
                            </small>
                          </p>
                        </hgroup>
                        {heroImage && (
                          <figure class="hero-figure">
                            <Image
                              src={heroImage}
                              alt={heroImageAlt ?? ''}
                              widths={[480, 800, 1200]}
                              sizes="(max-width: 800px) 100vw, 800px"
                              format="webp"
                              loading="eager"
                              fetchpriority="high"
                            />
                            {heroImageAlt && <figcaption>{heroImageAlt}</figcaption>}
                          </figure>
                        )}
                      </header>

                      {series && <SeriesContext series={series} lang={lang ?? DEFAULT_LANG} variant="aside" />}

                      <TableOfContents headings={headings} lang={lang} />

                      <Content />
                    </>
                  )}'''

          block_pattern = re.compile(r"        <header>\n.*?        <Content />", re.S)
          old_music_css = re.compile(r"\n  \.music-playlist \{.*?\n  @media \(max-width: 480px\) \{\n    \.music-header \{ flex-direction: column; \}\n    \.music-cover \{ width: 96px; height: 96px; \}\n  \}\n", re.S)

          for path, import_path in files.items():
            text = path.read_text(encoding="utf-8")

            marker = "import PageLayout"
            page_import = next(line for line in text.splitlines() if line.startswith(marker))
            if "MusicPostLayout" not in text:
              text = text.replace(page_import, page_import + f"\nimport MusicPostLayout from '{import_path}';", 1)

            text = text.replace(
              "  <progress\n    id=\"read-progress\"",
              "  {postType !== 'music' && <progress\n    id=\"read-progress\"",
              1,
            )
            text = text.replace("  ></progress>\n\n  <aside class=\"border-rail\"", "  ></progress>}\n\n  {postType !== 'music' && <aside class=\"border-rail\"", 1)
            text = text.replace("  </aside>\n\n  <div class=\"post-grid\">", "  </aside>}\n\n  <div class:list={['post-grid', { 'music-post-grid': postType === 'music' }] }>", 1)
            text = text.replace(
              "    <aside class=\"toc-col\" aria-label={t(lang, 'toc.label')}>\n      <TableOfContents headings={headings} lang={lang} sidebar />\n    </aside>",
              "    {postType !== 'music' && (\n      <aside class=\"toc-col\" aria-label={t(lang, 'toc.label')}>\n        <TableOfContents headings={headings} lang={lang} sidebar />\n      </aside>\n    )}",
              1,
            )
            text = text.replace(
              "          { name: t(lang, 'nav.archive'), href: `${urlPrefix(lang)}/archive/` },",
              "          postType === 'music'\n            ? { name: lang === 'pt' ? 'Música' : 'Music', href: lang === 'pt' ? '/pt/musicas/' : '/music/' }\n            : { name: t(lang, 'nav.archive'), href: `${urlPrefix(lang)}/archive/` },",
              1,
            )
            text = text.replace(
              "      <article data-pagefind-body data-pagefind-filter={`lang:${lang}`} lang={postLang}>",
              "      <article class:list={{ 'music-post-article': postType === 'music' }} data-pagefind-body data-pagefind-filter={`lang:${lang}`} lang={postLang}>",
              1,
            )
            text = text.replace(
              "      <article data-pagefind-body data-pagefind-filter={`lang:${lang}`} lang={lang ?? 'pt'}>",
              "      <article class:list={{ 'music-post-article': postType === 'music' }} data-pagefind-body data-pagefind-filter={`lang:${lang}`} lang={lang ?? 'pt'}>",
              1,
            )

            text, count = block_pattern.subn(replacement, text, count=1)
            if count != 1:
              raise RuntimeError(f"music content block not found in {path}")

            text = old_music_css.sub("\n", text, count=1)

            style_marker = "<style>\n"
            extra = """<style>\n  :global(.music-post-grid) {\n    display: block !important;\n    max-width: 76rem;\n    margin-inline: auto;\n  }\n\n  :global(.music-post-article) {\n    margin: 0;\n    padding: 0;\n    border: 0;\n    background: transparent;\n    box-shadow: none;\n  }\n\n"""
            text = text.replace(style_marker, extra, 1)
            path.write_text(text, encoding="utf-8")

      - name: Format changed files
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            src/components/MusicPostLayout.astro \
            'src/pages/blog/[...slug].astro' \
            'src/pages/pt/blog/[...slug].astro'

      - name: Commit generated change
        run: |
          rm .github/workflows/apply-music-post-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(music): add dedicated music post layout"
          git push origin HEAD:design/music-post-layout
