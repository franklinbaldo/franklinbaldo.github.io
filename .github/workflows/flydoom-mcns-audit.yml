name: FlyDoom MCNS audit

on:
  pull_request:
    paths:
      - "public/flydoom/malecns_l3_compact.mcns"
      - "public/flydoom/index.html"
      - "scripts/inspect_flydoom_mcns.py"
      - ".github/workflows/flydoom-mcns-audit.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
      - name: Inspect compact MaleCNS FlatBuffer
        run: python scripts/inspect_flydoom_mcns.py
