      - name: Validate Blog Post Tier cards as OKF knowledge
        run: >-
          uv run --with 'git+https://github.com/franklinbaldo/okf-parser@e8ed6bbd93846a40ac17a0be88c658020e85443a' okf-parser check knowledge/blog-post-tiers
          --require-spec ../../specs/okf-types/{slug}.md
