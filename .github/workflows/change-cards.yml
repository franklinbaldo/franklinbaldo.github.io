          uv run --with 'git+https://github.com/franklinbaldo/okf-parser@e8ed6bbd93846a40ac17a0be88c658020e85443a' okf-parser check knowledge/ai-epistemic-interventions
          --require-spec ../../specs/okf-types/{slug}.md
          --normative-spec

      - name: Validate AI epistemic convergence cards as OKF knowledge
