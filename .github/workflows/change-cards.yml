name: Change cards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changelog:
    name: OKF change card policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Require a card for this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-change-card.mjs

      - name: Validate change cards as OKF knowledge
        run: >-
          uv run --with 'git+https://github.com/franklinbaldo/okf-parser@e8ed6bbd93846a40ac17a0be88c658020e85443a' okf-parser check changelog/changes
          --require-spec ../../specs/okf-types/{slug}.md
          --normative-spec

      - name: Validate ToE cards as OKF knowledge
        run: >-
          uv run --with 'git+https://github.com/franklinbaldo/okf-parser@e8ed6bbd93846a40ac17a0be88c658020e85443a' okf-parser check knowledge/toe
          --require-spec ../../specs/okf-types/{slug}.md
          --normative-spec

      - name: Validate AI epistemic world cards as OKF knowledge
        run: >-
          uv run --with 'git+https://github.com/franklinbaldo/okf-parser@e8ed6bbd93846a40ac17a0be88c658020e85443a' okf-parser check knowledge/ai-epistemic-worlds
          --require-spec ../../specs/okf-types/{slug}.md
          --normative-spec

      - name: Validate AI epistemic intervention cards as OKF knowledge
