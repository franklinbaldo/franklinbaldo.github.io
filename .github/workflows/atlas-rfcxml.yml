name: Atlas — IETF RFCXML lane

on:
  workflow_dispatch:
    inputs:
      rfcs:
        description: "RFC numbers to mirror and harvest (space-separated, e.g. '9000' or '9000 8446')"
        required: true
        default: "9000"
        type: string
      rows_per_shard:
        description: "Parquet rows per shard"
        required: true
        default: "250000"
        type: string
      publish:
        description: "Publish verified Parquet + manifest to Internet Archive"
        required: true
        default: true
        type: boolean
      open_control_pr:
        description: "Open lightweight control-plane PR on main if publish succeeds"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: atlas-rfcxml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest-materialize-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
      IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment paths
        shell: bash
        run: |
          set -euo pipefail
          echo "WORK_ROOT=${RUNNER_TEMP}/atlas-rfcxml" >> "$GITHUB_ENV"
          echo "MIRROR_ROOT=${RUNNER_TEMP}/atlas-rfcxml/mirror" >> "$GITHUB_ENV"
          echo "OCCURRENCES=${RUNNER_TEMP}/atlas-rfcxml/occurrences.jsonl" >> "$GITHUB_ENV"
          echo "PARQUET_DIR=${RUNNER_TEMP}/atlas-rfcxml/extracted" >> "$GITHUB_ENV"
          echo "INVENTORY=${RUNNER_TEMP}/atlas-rfcxml/source-inventory.json" >> "$GITHUB_ENV"
          echo "PUBLICATION=${RUNNER_TEMP}/atlas-rfcxml/publication.json" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "scripts/science-equations/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/science-equations/requirements.txt

      - name: Mirror and validate RFCXML files
        id: acquire
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MIRROR_ROOT"
          rfcs="${{ inputs.rfcs }}"
          for rfc in $rfcs; do
            num="$(echo "$rfc" | tr -dc '0-9')"
            filename="rfc${num}.xml"
            url="https://www.rfc-editor.org/rfc/${filename}"
            echo "Fetching $url..."
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors \
              -A 'ScientificEquationAtlas/1.0 (+https://franklinbaldo.github.io/)' \
              "$url" \
              -o "$MIRROR_ROOT/${filename}"

            python - "$MIRROR_ROOT/${filename}" <<'PY'
          import pathlib, sys
          import xml.etree.ElementTree as ET

          path = pathlib.Path(sys.argv[1])
          if path.stat().st_size == 0:
              raise SystemExit(f"empty XML acquisition: {path}")
          ET.parse(path)
          print(f"validated XML: {path} ({path.stat().st_size} bytes)")
          PY
          done

          python scripts/science-equations/build-source-inventory.py \
            --root "$MIRROR_ROOT" \
            --glob '*.xml' \
            --source-id ietf-rfcxml-formal-blocks \
            --output "$INVENTORY"

          snapshot="$(python - "$INVENTORY" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("inventory-sha256:" + data["inventory_sha256"])
          PY
          )"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "rfcs=$rfcs" >> "$GITHUB_OUTPUT"

      - name: Harvest attested formal blocks
        id: harvest
        shell: bash
        env:
          SNAPSHOT: ${{ steps.acquire.outputs.snapshot }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OCCURRENCES")" "$PARQUET_DIR"
          python scripts/science-equations/harvest-ietf-rfcxml.py \
            --mirror "$MIRROR_ROOT" \
            --snapshot "$SNAPSHOT" \
            --strict-xml \
            > "$OCCURRENCES"

          count="$(wc -l < "$OCCURRENCES")"
          echo "Extracted $count occurrences"

          python scripts/science-equations/materialize-parquet.py \
            --input "$OCCURRENCES" \
            --output-dir "$PARQUET_DIR" \
            --stage extracted \
            --rows-per-shard "${{ inputs.rows_per_shard }}" \
            --validate-only

      - name: Materialize canonical Parquet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science-equations/materialize-parquet.py \
            --input "$OCCURRENCES" \
            --output-dir "$PARQUET_DIR" \
            --stage extracted \
            --rows-per-shard "${{ inputs.rows_per_shard }}"

      - name: Verify Internet Archive credentials
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          ia configure --check

      - name: Publish and verify Internet Archive item
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science-equations/publish-internet-archive.py \
            --manifest "$PARQUET_DIR/manifest.json" \
            > "$PUBLICATION"

      - name: Build lightweight control-plane record
        if: ${{ always() && (steps.harvest.outcome == 'success') }}
        shell: bash
        env:
          SNAPSHOT: ${{ steps.acquire.outputs.snapshot }}
          RFCS: ${{ steps.acquire.outputs.rfcs }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_ROOT/control"
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone

          work_root = pathlib.Path(os.environ["WORK_ROOT"])
          parquet_dir = pathlib.Path(os.environ["PARQUET_DIR"])
          manifest_path = parquet_dir / "manifest.json"
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else None
          inv_path = pathlib.Path(os.environ["INVENTORY"])
          inventory = json.loads(inv_path.read_text()) if inv_path.exists() else None
          pub_path = pathlib.Path(os.environ["PUBLICATION"])
          publication = json.loads(pub_path.read_text()) if (pub_path.exists() and pub_path.stat().st_size > 0) else None

          record = {
              "schema_version": 1,
              "record_type": "science-atlas-publication",
              "source_id": manifest["source_id"] if manifest else "ietf-rfcxml-formal-blocks",
              "source_snapshot": manifest["source_snapshot"] if manifest else os.environ.get("SNAPSHOT"),
              "stage": manifest["stage"] if manifest else "extracted",
              "rows": manifest["rows"] if manifest else 0,
              "shards": manifest["shards"] if manifest else [],
              "source_inventory": {
                  "inventory_sha256": inventory["inventory_sha256"] if inventory else None,
                  "file_count": inventory["file_count"] if inventory else 0,
                  "total_bytes": inventory["total_bytes"] if inventory else 0,
                  "files": inventory["files"] if inventory else [],
              },
              "scope": {
                  "rfcs": os.environ.get("RFCS", "").split(),
              },
              "provenance_guards": {
                  "provenance_class": "attested",
                  "ocr_performed": False,
                  "reconstruction_performed": False,
                  "linked_graphic_bytes_redistributed": False,
              },
              "internet_archive": publication,
              "workflow": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              },
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          (work_root / "control" / "publication.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload run evidence and Parquet dataset
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-rfcxml-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.INVENTORY }}
            ${{ env.OCCURRENCES }}
            ${{ env.PARQUET_DIR }}/manifest.json
            ${{ env.PARQUET_DIR }}/*.parquet
            ${{ env.PUBLICATION }}
            ${{ env.WORK_ROOT }}/control/publication.json
          if-no-files-found: warn
          retention-days: 90

      - name: Open lightweight control-plane PR
        if: ${{ inputs.open_control_pr && inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.acquire.outputs.snapshot }}
        run: |
          set -euo pipefail
          [[ -s "$PUBLICATION" ]] || { echo "publication record missing" >&2; exit 4; }

          digest="${SNAPSHOT#inventory-sha256:}"
          short="${digest:0:16}"
          control_branch="automation/atlas-rfcxml-run-${GITHUB_RUN_ID}"
          target="data/science-equations/publications/ietf-rfcxml-formal-blocks/${digest}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$control_branch"
          mkdir -p "$(dirname "$target")"
          cp "$WORK_ROOT/control/publication.json" "$target"
          git add "$target"
          git commit -m "data(atlas): record RFCXML publication ${short}"
          git push origin "$control_branch"

          gh pr create \
            --base main \
            --head "$control_branch" \
            --title "data(atlas): record RFCXML publication ${short}" \
            --body "Automated lightweight control-plane record for verified RFCXML Atlas publication. No source XML or raw files are committed to Git. Parquet shards are published to Internet Archive and available via run artifacts."
