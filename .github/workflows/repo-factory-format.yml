name: Repo Factory bootstrap

on:
  push:
    branches: [feat/repo-factory-game]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/repo-factory-game
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate public Repo Factory snapshot
        run: node scripts/generate-repo-factory.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format Repo Factory files
        run: npx prettier --write scripts/generate-repo-factory.mjs scripts/pregen.mjs src/scripts/repo-factory.ts src/styles/repo-factory.css src/generated/repo-factory.json
      - name: Commit bootstrap snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-repo-factory.mjs scripts/pregen.mjs src/scripts/repo-factory.ts src/styles/repo-factory.css src/generated/repo-factory.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "data(games): bootstrap Repo Factory snapshot"
          git push origin HEAD:feat/repo-factory-game
