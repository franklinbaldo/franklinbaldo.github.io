name: Hrönir Autopilot

# Merge machine for Hrönir session PRs.
#
# Fires when the "Check" workflow finishes on a PR branch. If that PR
# touches only the safe paths (rate files or draft version files required),
# CI is green and no review blocks it, it is merged with a merge commit.
# Sessions themselves are spawned externally (agent routines) — this
# workflow only merges.
#
# Gate: path check + CI green + no blocking review. No external API
# verification needed — the safe-path constraint is sufficient: only hronir
# sessions produce rate files under .routines/hronir/rates/ (hourly matches
# routine) or v-* draft files under src/content/blog/ (daily edit-worst
# routine).

on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to merge (manual)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serializes merges so two autopilot runs never merge simultaneously.
  group: hronir-merge
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  # A PR is a Hrönir session PR when every changed file lives under one of these
  # prefixes AND at least one file is a rate file or a draft (see the gate).
  # The two src/generated manifests are RFC 0015 outputs of prune/flatten —
  # committed, session-produced, and safe by the same argument as rate files.
  SAFE_PREFIXES: ".routines/hronir/ src/content/blog/ src/generated/versions-pruned.json src/generated/versions-history.json"

jobs:
  merge:
    runs-on: ubuntu-latest
    # Manual dispatch, or a successful Check run on a real PR branch (not main).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != 'main')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve target PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ github.event.inputs.pr }}"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
              --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR:-}" ]; then
            echo "No open PR to act on."
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Target PR: #$PR"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Gate and merge
        id: merge
        if: steps.resolve.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail

          # 1) Path gate: only .routines/hronir/** and src/content/blog/**, with
          #    at least one rate file OR one draft/version file. This is the
          #    sole identity check — only hronir sessions produce rate files
          #    under .routines/hronir/rates/ (the hourly matches routine) or
          #    v-<timestamp> draft files under src/content/blog/ (the daily
          #    edit-worst routine, which runs no matches and so has no rate
          #    file to show — see docs/hronir-edit-worst-routine.md).
          #    Every session also writes a top-level journal file directly under
          #    .routines/ (see CLAUDE.md "Journals de sessão"); that file isn't
          #    under .routines/hronir/, so it gets its own exception below —
          #    subdirs other than hronir/ (e.g. .routines/takeout/) stay excluded.
          #    src/generated/versions-selected.json is gitignored (recomputed
          #    fresh from rate files + version files by prebuild/hronir:select,
          #    no memory of any prior selection — see RFC 0010 amendment
          #    2026-07-01 and docs/hronir-agent-routine.md), so it never
          #    appears in a session PR's file list and needs no exception here.
          FILES=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')
          HAS_RATE=0
          HAS_DRAFT=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in .routines/hronir/rates/*) HAS_RATE=1 ;; esac
            # Drafts: legacy sibling v-* files, or RFC 0015 drafts for
            # flattened slugs (edit-worst writes them under drafts/).
            case "$f" in src/content/blog/*/v-*.md | src/content/blog/*/v-*.mdx | .routines/hronir/drafts/*) HAS_DRAFT=1 ;; esac
            ok=1
            for p in $SAFE_PREFIXES; do case "$f" in "$p"*) ok=0 ;; esac; done
            if [ "$ok" -ne 0 ]; then
              case "$f" in
                .routines/*/*) ;;
                .routines/*.md) ok=0 ;;
              esac
            fi
            if [ "$ok" -ne 0 ]; then
              echo "PR #$PR touches out-of-scope file: $f — skipping."
              echo "merged=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done <<< "$FILES"
          if [ "$HAS_RATE" -ne 1 ] && [ "$HAS_DRAFT" -ne 1 ]; then
            echo "PR #$PR has no rate files and no draft version files — skipping."
            echo "merged=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 1b) Rate file deletion guard: reject PRs that delete existing rate files.
          # Deletions cause the duel count to shrink instead of grow. Rate files are
          # immutable once committed — sessions may only add, never remove.
          DELETED_RATES=$(gh pr view "$PR" --repo "$REPO" --json files \
            --jq '[.files[] | select(.status == "removed") | select(.path | startswith(".routines/hronir/rates/"))] | length')
          if [ "${DELETED_RATES:-0}" -gt 0 ]; then
            echo "PR #$PR deleta ${DELETED_RATES} rate file(s) — bloqueado pelo autopilot."
            echo "Rate files são imutáveis. Nunca delete arquivos de sessões anteriores."
            echo "merged=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 2) Mergeable + CI green (defensive; the trigger already implies
          #    the Check run passed, but double-check for safety).
          MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable')
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "PR #$PR not mergeable (mergeable=$MERGEABLE) — skipping."
            echo "merged=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 2b) Blocking review: the routines skip PRs with blocking reviews;
          #     the autopilot must respect the same signal.
          REVIEW=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision --jq '.reviewDecision // ""')
          if [ "$REVIEW" = "CHANGES_REQUESTED" ]; then
            echo "PR #$PR has a blocking review (reviewDecision=$REVIEW) — skipping."
            echo "merged=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Require only the project's own CI job ("check") to be green. Third-
          # party review bots (Kilo, Codex, GitGuardian) post their own check
          # runs and may fail on usage limits — they must NOT block the merge.
          STATE=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
            --jq '[.statusCheckRollup[]? | select(.name == "check") | (.conclusion // .state)] as $c
                  | if ($c|length)==0 then "NONE"
                    elif ([$c[] | select(. != "SUCCESS")] | length) > 0 then "PENDING_OR_FAILED"
                    else "SUCCESS" end')
          if [ "$STATE" != "SUCCESS" ]; then
            echo "PR #$PR checks not all green (state=$STATE) — skipping."
            echo "merged=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 3) Merge commit (not squash) — repo preference is to preserve history.
          gh pr merge "$PR" --repo "$REPO" --merge --delete-branch
          echo "Merged PR #$PR."
          echo "merged=$PR" >> "$GITHUB_OUTPUT"
