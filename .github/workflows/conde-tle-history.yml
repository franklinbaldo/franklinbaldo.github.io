name: Conde historical TLE audit

on:
  pull_request:
    paths:
      - 'scripts/research/conde_tle_archive.py'
      - '.github/workflows/conde-tle-history.yml'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyarrow==23.0.0'
      - run: python scripts/research/conde_tle_archive.py
