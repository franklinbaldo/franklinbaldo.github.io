name: Fix FlyDoom Fourier manual reset

on:
  push:
    branches:
      - fix/flydoom-fourier-manual-reset

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/flydoom-fourier-manual-reset
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch reset semantics
        run: python scripts/patch_flydoom_manual_reset.py
      - name: Format
        run: npx prettier --write public/flydoom-fourier/index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flydoom-fourier/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: reset FlyDoom Fourier only on Reset"
          git push origin HEAD:fix/flydoom-fourier-manual-reset
