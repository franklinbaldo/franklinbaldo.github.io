name: FlyDoom compile compact runtime

on:
  push:
    branches:
      - feature/flydoom-neural-viewport
    paths:
      - "scripts/compile_flydoom_compact.py"
      - ".github/workflows/flydoom-compile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/flydoom-neural-viewport
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
      - name: Install compiler dependencies
        run: python -m pip install --disable-pip-version-check numpy pyarrow scipy flatbuffers
      - name: Compile atomic runtime artifacts
        run: python scripts/compile_flydoom_compact.py
      - name: Audit generated FlatBuffer
        run: python scripts/inspect_flydoom_mcns.py
      - name: Verify artifact cardinality and hash chain
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          meta = json.loads(Path('public/flydoom/data/circuit.meta.json').read_text())
          region = Path('public/flydoom/data/region_map.bin').read_bytes()
          assert len(region) == meta['runtime']['neurons']
          for key, rel in {
              'circuit_mcns_sha256': 'public/flydoom/malecns_l3_compact.mcns',
              'provenance_parquet_sha256': 'public/flydoom/data/provenance.parquet',
              'region_map_bin_sha256': 'public/flydoom/data/region_map.bin',
          }.items():
              got = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              assert got == meta['hash_chain'][key], (key, got, meta['hash_chain'][key])
          print(json.dumps(meta['runtime'], indent=2))
          PY
      - name: Commit generated runtime artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flydoom/malecns_l3_compact.mcns public/flydoom/data/provenance.parquet public/flydoom/data/region_map.bin public/flydoom/data/circuit.meta.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already match the branch."
            exit 0
          fi
          git commit -m "build(flydoom): pin compact runtime provenance artifacts"
          git push origin HEAD:feature/flydoom-neural-viewport
