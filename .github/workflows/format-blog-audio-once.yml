name: Format blog audio once

on:
  push:
    branches: [audio/blog-publishing-contract]
    paths:
      - .github/workflows/format-blog-audio-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: audio/blog-publishing-contract
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format and remove one-shot workflow
        run: |
          npx prettier --write scripts/audio/apply-blog-publication.mjs scripts/audio/publish-blog-internet-archive.mjs src/lib/blog-audio.js src/pages/audio.xml.js
          git rm .github/workflows/format-blog-audio-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audio/apply-blog-publication.mjs scripts/audio/publish-blog-internet-archive.mjs src/lib/blog-audio.js src/pages/audio.xml.js
          git commit -m 'style(audio): apply repository Prettier formatting'
          git push origin HEAD:audio/blog-publishing-contract
