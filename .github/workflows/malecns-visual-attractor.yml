name: MaleCNS Visual Efficiency Kaggle

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-visual-attractor.yml"
      - "scripts/malecns-visual-attractor/**"
  workflow_dispatch:
    inputs:
      visual_ref:
        description: Exact papers commit containing low-energy visual-efficiency curriculum v5
        required: true
        default: "52ca03ca97f671ea4bc970c0f5d702ee6bdcc2aa"
        type: string
      runtime_ref:
        description: Exact papers commit containing the canonical MaleCNS compiler
        required: true
        default: "437083ae30f24f6f424ce405182d90b275b62621"
        type: string
      accelerator:
        description: Kaggle accelerator
        required: true
        default: NvidiaTeslaT4
        type: string

permissions:
  contents: read

concurrency:
  group: malecns-visual-efficiency-kaggle
  cancel-in-progress: false

jobs:
  run-visual-efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Configure Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          [[ -n "$KAGGLE_API_TOKEN" ]] || { echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2; exit 2; }
          [[ -n "$KAGGLE_USERNAME" ]] || { echo "Missing GitHub variable KAGGLE_USERNAME" >&2; exit 2; }
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'

      - name: Run public low-energy curriculum on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          VISUAL_REF: ${{ inputs.visual_ref || '52ca03ca97f671ea4bc970c0f5d702ee6bdcc2aa' }}
          RUNTIME_REF: ${{ inputs.runtime_ref || '437083ae30f24f6f424ce405182d90b275b62621' }}
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          bash scripts/malecns-visual-attractor/kaggle-efficiency-v5.sh \
            --summary "$RUNNER_TEMP/malecns-visual-efficiency-summary.json" \
            --visual-ref "$VISUAL_REF" \
            --runtime-ref "$RUNTIME_REF" \
            --accelerator "$ACCELERATOR"

      - name: Summarize efficiency curriculum
        run: |
          python - "$RUNNER_TEMP/malecns-visual-efficiency-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          best=d.get('lowest_budget_best', {})
          rewards=best.get('condition_reward', {})
          print('## MaleCNS visual-efficiency curriculum v5')
          print(f"- visual ref: `{d.get('visual_ref')}`")
          print(f"- resolved / total receptors: **{d.get('receiver', {}).get('optic_column_resolved')} / {d.get('receiver', {}).get('visual_receptors_total')}**")
          print(f"- budgets: **{d.get('parameters', {}).get('budgets')}**")
          print(f"- lowest-budget advantage vs strongest control: **{best.get('advantage')}**")
          print(f"- max energy mismatch all stages: **{d.get('max_energy_mismatch_all_stages')}**")
          print(f"- learned reward: **{rewards.get('learned')}**")
          print(f"- uniform TV: **{rewards.get('uniform_tv')}**")
          print(f"- spatial shuffle: **{rewards.get('spatial_shuffle')}**")
          print(f"- blank: **{rewards.get('blank')}**")
          print(f"- learned approach: **{best.get('approach', {}).get('learned')}**")
          print(f"- public Kaggle: {d.get('kaggle_url')}")
          print('- calibration only; v5 uses an explicit retinal intensity floor and genuinely sub-capacity TV budgets')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: malecns-visual-efficiency-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-visual-efficiency-summary.json
          if-no-files-found: error
          retention-days: 30
