name: MaleCNS Stationary Screen Reward Kaggle

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-visual-attractor.yml"
      - "scripts/malecns-visual-attractor/**"
  workflow_dispatch:
    inputs:
      visual_ref:
        description: Exact papers commit containing the stationary-screen experiment
        required: true
        default: "a62af61a8267220ab3f01b4244fd38d8eddd99c3"
        type: string
      runtime_ref:
        description: Exact papers commit containing the canonical MaleCNS compiler
        required: true
        default: "437083ae30f24f6f424ce405182d90b275b62621"
        type: string
      accelerator:
        description: Kaggle accelerator
        required: true
        default: NvidiaTeslaT4
        type: string

permissions:
  contents: read

concurrency:
  group: malecns-stationary-screen-reward-kaggle
  cancel-in-progress: false

jobs:
  run-stationary-screen-reward:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Configure Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          [[ -n "$KAGGLE_API_TOKEN" ]] || { echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2; exit 2; }
          [[ -n "$KAGGLE_USERNAME" ]] || { echo "Missing GitHub variable KAGGLE_USERNAME" >&2; exit 2; }
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'

      - name: Run public stationary-screen reward loop on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          VISUAL_REF: ${{ inputs.visual_ref || 'a62af61a8267220ab3f01b4244fd38d8eddd99c3' }}
          RUNTIME_REF: ${{ inputs.runtime_ref || '437083ae30f24f6f424ce405182d90b275b62621' }}
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          bash scripts/malecns-visual-attractor/kaggle.sh \
            --summary "$RUNNER_TEMP/malecns-stationary-screen-summary.json" \
            --visual-ref "$VISUAL_REF" \
            --runtime-ref "$RUNTIME_REF" \
            --accelerator "$ACCELERATOR"

      - name: Summarize calibration
        run: |
          python - "$RUNNER_TEMP/malecns-stationary-screen-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          best=d.get('best', {})
          print('## MaleCNS stationary-screen reward calibration')
          print(f"- visual ref: `{d.get('visual_ref')}`")
          print(f"- runtime ref: `{d.get('runtime_ref')}`")
          print(f"- mapped visual receptors: **{d.get('receiver', {}).get('visual_receptors')}**")
          print(f"- best generation/candidate: **{best.get('generation')} / {best.get('candidate')}**")
          print(f"- best integrated receiver excitation: **{best.get('score')}**")
          print(f"- peak receiver excitation: **{best.get('peak_reward')}** at step **{best.get('peak_step')}**")
          print(f"- secondary approach: **{best.get('approach')}**")
          print(f"- public Kaggle: {d.get('kaggle_url')}")
          print('- calibration only; this is not Run 2 and not a capture claim')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: malecns-stationary-screen-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-stationary-screen-summary.json
          if-no-files-found: error
          retention-days: 30
