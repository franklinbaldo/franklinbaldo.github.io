name: MaleCNS Online Plastic Screen Learning

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-visual-attractor.yml"
      - "scripts/malecns-visual-attractor/**"
  workflow_dispatch:
    inputs:
      visual_ref:
        description: Exact papers commit containing the online reward-plastic screen learner
        required: true
        default: "6e5b4897d8f8ace976dcf351a86d1bc684a462ba"
        type: string
      runtime_ref:
        description: Exact papers commit containing the canonical MaleCNS compiler
        required: true
        default: "437083ae30f24f6f424ce405182d90b275b62621"
        type: string
      accelerator:
        description: Kaggle accelerator
        required: true
        default: NvidiaTeslaT4
        type: string

permissions:
  contents: read

concurrency:
  group: malecns-online-plastic-kaggle
  cancel-in-progress: true

jobs:
  run-online-plastic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Configure Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          [[ -n "$KAGGLE_API_TOKEN" ]] || { echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2; exit 2; }
          [[ -n "$KAGGLE_USERNAME" ]] || { echo "Missing GitHub variable KAGGLE_USERNAME" >&2; exit 2; }
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'

      - name: Run online reward-plastic learner on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          VISUAL_REF: ${{ inputs.visual_ref || '6e5b4897d8f8ace976dcf351a86d1bc684a462ba' }}
          RUNTIME_REF: ${{ inputs.runtime_ref || '437083ae30f24f6f424ce405182d90b275b62621' }}
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          bash scripts/malecns-visual-attractor/kaggle-online-plastic.sh \
            --summary "$RUNNER_TEMP/malecns-online-plastic-summary.json" \
            --visual-ref "$VISUAL_REF" \
            --runtime-ref "$RUNTIME_REF" \
            --accelerator "$ACCELERATOR"

      - name: Summarize online learning
        run: |
          python - "$RUNNER_TEMP/malecns-online-plastic-summary.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          episodes=d.get('episodes', [])
          first=episodes[0] if episodes else {}
          last=episodes[-1] if episodes else {}
          learning=d.get('learning_state', {})
          params=d.get('parameters', {})
          print('## MaleCNS online reward-plastic screen learning')
          print(f"- visual ref: `{d.get('visual_ref')}`")
          print(f"- learning state: **{learning.get('mode', 'unknown')}**")
          print(f"- rule: **{d.get('learning_rule', {}).get('type')}**")
          print(f"- budgets: **{params.get('budgets')}**")
          print(f"- episodes per budget / steps: **{params.get('episodes_per_budget')} / {params.get('steps')}**")
          print(f"- first episode advantage: **{first.get('advantage')}**")
          print(f"- last episode advantage: **{last.get('advantage')}**")
          print(f"- best training advantage: **{d.get('best_training_advantage')}**")
          print(f"- final adapter weight norm: **{d.get('final_weight_norm')}**")
          print(f"- max energy mismatch: **{d.get('max_energy_mismatch')}**")
          print(f"- public Kaggle: {d.get('kaggle_url')}")
          print('- training calibration: replay is not the learner; the 6x6 adapter updates online from receiver reward')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: malecns-online-plastic-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-online-plastic-summary.json
          if-no-files-found: error
          retention-days: 30
