name: MaleCNS Stationary Screen Kaggle Status

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-stationary-screen-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malecns-stationary-screen-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Snapshot stationary-screen Kaggle status and logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KERNEL_ID: ${{ vars.KAGGLE_MALECNS_STATIONARY_SCREEN_KERNEL_ID }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" ]] || exit 2
          [[ -n "$KAGGLE_USERNAME" ]] || exit 2
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'
          KERNEL="${KERNEL_ID:-${KAGGLE_USERNAME}/malecns-stationary-screen-reward}"
          CHECKED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
          echo "kernel=$KERNEL"
          echo "checked_at=$CHECKED_AT"
          echo "status=$STATUS"
          echo "----- Kaggle stationary-screen execution log snapshot -----"
          kaggle kernels logs "$KERNEL" 2>&1 || true
