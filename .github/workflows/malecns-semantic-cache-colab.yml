name: MaleCNS Semantic Cache Colab

on:
  push:
    branches:
      - experiment/malecns-semantic-cache-colab
    paths:
      - ".github/workflows/malecns-semantic-cache-colab.yml"
      - "scripts/malecns-semantic-cache/colab.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malecns-semantic-cache-colab
  cancel-in-progress: true

jobs:
  run-semantic-cache-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Configure Colab CLI
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          python -m pip install --disable-pip-version-check 'google-colab-cli==0.6.0' 'jupyter-kernel-client==0.9.0'
          if [[ -n "$COLAB_TOKEN_JSON" ]]; then
            install -d -m 700 "$HOME/.config/colab-cli"
            printf '%s' "$COLAB_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
            chmod 600 "$HOME/.config/colab-cli/token.json"
            echo "COLAB_AUTH_PROVIDER=oauth2" >> "$GITHUB_ENV"
          elif [[ -n "$COLAB_ADC_JSON" ]]; then
            printf '%s' "$COLAB_ADC_JSON" > "$RUNNER_TEMP/colab-adc.json"
            chmod 600 "$RUNNER_TEMP/colab-adc.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/colab-adc.json" >> "$GITHUB_ENV"
            echo "COLAB_AUTH_PROVIDER=adc" >> "$GITHUB_ENV"
          else
            echo "Missing GitHub secret COLAB_TOKEN_JSON (or COLAB_ADC_JSON)" >&2
            exit 2
          fi
      - name: Build once and train from semantic cache on Colab
        env:
          COLAB_EXEC_TIMEOUT: "3600"
        run: |
          bash scripts/malecns-semantic-cache/colab.sh \
            --output-dir "$RUNNER_TEMP/malecns-semantic-cache-colab" \
            --papers-ref "42aa0e8e678fae35fea4eb5314b505bc03ecfa2b" \
            --gpu T4
      - name: Summarize semantic cache Colab test
        run: |
          summary="$RUNNER_TEMP/malecns-semantic-cache-colab/github-summary.json"
          [[ -f "$summary" ]] || { echo "missing Colab semantic cache summary" >&2; exit 1; }
          python - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('## MaleCNS semantic cache — Colab T4')
          print(f"- cache build: **{d.get('cache_build_seconds', 0):.1f}s**")
          print(f"- cached training: **{d.get('cached_training_seconds', 0):.1f}s**")
          print(f"- total: **{d.get('total_seconds', 0):.1f}s**")
          print(f"- preregistered checks: `{d.get('preregistered_checks')}`")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malecns-semantic-cache-colab-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-semantic-cache-colab
          if-no-files-found: error
          retention-days: 30
