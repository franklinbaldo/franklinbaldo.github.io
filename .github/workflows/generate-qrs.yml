name: Generate OG QR codes

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Regenerate a single slug (leave empty for all missing)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "src/content/blog/**.md"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Generate missing QR codes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            node scripts/generate-qrs.mjs --slug=${{ github.event.inputs.slug }}
          else
            node scripts/generate-qrs.mjs
          fi

      - name: Commit cached QR codes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain .cache/qr)" ]; then
            git add .cache/qr
            git commit -m "chore(og): refresh QR cache [skip ci]"
            git push
          else
            echo "No new QR codes to commit."
          fi
