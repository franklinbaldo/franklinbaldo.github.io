name: V17 Realtext Benchmark Ephemeral

on:
  push:
    branches:
      - experiment/v17-realtext-benchmark-20260923

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require papers credential
        env:
          PAPERS_READ_TOKEN: ${{ secrets.PAPERS_READ_TOKEN }}
        run: |
          test -n "$PAPERS_READ_TOKEN"
      - name: Checkout exact papers source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: franklinbaldo/papers
          ref: 68d683f6765ffd34ec41876ee22e1e74a2acb844
          path: papers
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.PAPERS_READ_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run v17 real-text benchmark
        working-directory: papers/demos/emergent_token_generation
        run: |
          python benchmark_response_equivalence.py > /tmp/v17-full.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("RESULT-WORKING-DEMO-V17-EQUIVALENCE-BENCHMARK-2026-09-23.json")
          d=json.loads(p.read_text())
          print(json.dumps({
            "experiment": d["experiment"],
            "examples": d["examples"],
            "positives": d["positives"],
            "future_bpb_tolerance": d["future_bpb_tolerance"],
            "auroc": d["auroc"],
          }, indent=2))
          PY
      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v17-realtext-benchmark
          path: papers/demos/emergent_token_generation/RESULT-WORKING-DEMO-V17-EQUIVALENCE-BENCHMARK-2026-09-23.json
          retention-days: 30
