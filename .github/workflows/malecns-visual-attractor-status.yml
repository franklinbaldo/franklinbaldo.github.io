name: MaleCNS Visual Attractor Kaggle Status

on:
  push:
    branches:
      - experiment/malecns-visual-attractor
    paths:
      - ".github/workflows/malecns-visual-attractor-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Query current private Kaggle kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KERNEL_ID: ${{ vars.KAGGLE_MALECNS_VISUAL_ATTRACTOR_KERNEL_ID }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" ]] || exit 2
          [[ -n "$KAGGLE_USERNAME" ]] || exit 2
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'
          KERNEL="${KERNEL_ID:-${KAGGLE_USERNAME}/malecns-visual-attractor}"
          echo "kernel=$KERNEL"
          date -u '+checked_at=%Y-%m-%dT%H:%M:%SZ'
          kaggle kernels status "$KERNEL"
