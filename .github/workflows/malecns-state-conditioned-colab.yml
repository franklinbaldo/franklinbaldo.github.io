name: MaleCNS State Conditioned Colab

on:
  push:
    branches:
      - experiment/malecns-state-conditioned-colab
    paths:
      - ".github/workflows/malecns-state-conditioned-colab.yml"
      - "scripts/malecns-state-conditioned/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malecns-state-conditioned-colab
  cancel-in-progress: true

jobs:
  run-state-conditioned-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Configure Colab CLI
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          python -m pip install --disable-pip-version-check 'google-colab-cli==0.6.0' 'jupyter-kernel-client==0.9.0'
          if [[ -n "$COLAB_TOKEN_JSON" ]]; then
            install -d -m 700 "$HOME/.config/colab-cli"
            printf '%s' "$COLAB_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
            chmod 600 "$HOME/.config/colab-cli/token.json"
            echo "COLAB_AUTH_PROVIDER=oauth2" >> "$GITHUB_ENV"
          elif [[ -n "$COLAB_ADC_JSON" ]]; then
            printf '%s' "$COLAB_ADC_JSON" > "$RUNNER_TEMP/colab-adc.json"
            chmod 600 "$RUNNER_TEMP/colab-adc.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/colab-adc.json" >> "$GITHUB_ENV"
            echo "COLAB_AUTH_PROVIDER=adc" >> "$GITHUB_ENV"
          else
            echo "Missing GitHub secret COLAB_TOKEN_JSON (or COLAB_ADC_JSON)" >&2
            exit 2
          fi
      - name: Run state-conditioned coupling on Colab
        env:
          COLAB_EXEC_TIMEOUT: "5400"
        run: |
          bash scripts/malecns-state-conditioned/colab.sh \
            --output-dir "$RUNNER_TEMP/malecns-state-conditioned" \
            --papers-ref "ac9c3bc7a4dcd36b2615afd1db441e420a6e059a" \
            --gpu T4
      - name: Summarize state-conditioned coupling
        run: |
          summary="$RUNNER_TEMP/malecns-state-conditioned/github-summary.json"
          [[ -f "$summary" ]] || { echo "missing state-conditioned summary" >&2; exit 1; }
          python - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('## MaleCNS state-conditioned coupling — Colab T4')
          print(f"- seeds: `{d.get('seeds')}`")
          print(f"- cache build: **{d.get('cache_build_seconds',0):.1f}s**")
          print(f"- cached training: **{d.get('cached_training_seconds',0):.1f}s**")
          for arm,stats in d.get('summaries',{}).items():
              print(f"- {arm}: wins vs static={stats['wins_vs_static']}/4, mean Δ vs static unseen={stats['mean_minus_static_unseen']:+.6f}, mean Δ vs independent unseen={stats['mean_minus_independent_unseen']:+.6f}, mean Δ all={stats['mean_minus_independent_all']:+.6f}, promoted={d.get('promotion_checks',{}).get(arm)}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malecns-state-conditioned-colab-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-state-conditioned
          if-no-files-found: error
          retention-days: 30
