name: Visual evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install pinned official Zola release
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz \
            --output "$RUNNER_TEMP/zola.tar.gz"
          echo "7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zola-bin"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola-bin"
          echo "$RUNNER_TEMP/zola-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zola-bin/zola" --version

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start preview
        run: |
          node scripts/zola/serve.mjs --host 127.0.0.1 --port 4321 > /tmp/zola-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zola-preview.log
          exit 1

      - name: Capture
        run: node scripts/screenshots.mjs

      - name: Record revision identity
        run: |
          cat > /tmp/screenshots/revision.json <<EOF
          {
            "event": "${{ github.event_name }}",
            "head_sha": "${{ github.event.pull_request.head.sha || github.sha }}",
            "tested_sha": "${{ github.sha }}",
            "pull_request": "${{ github.event.pull_request.number || '' }}"
          }
          EOF

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-evidence-head-${{ github.event.pull_request.head.sha || github.sha }}-tested-${{ github.sha }}
          path: /tmp/screenshots/
          if-no-files-found: error
