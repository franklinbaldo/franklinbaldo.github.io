name: MaleCNS Few-NERD supervised Colab

on:
  push:
    branches:
      - experiment/malecns-fewnerd-supervised-colab
    paths:
      - ".github/workflows/malecns-fewnerd-supervised-colab.yml"
      - "scripts/malecns-fewnerd/stages.sh"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke or full"
        required: false
        default: "smoke"
      papers_ref:
        description: "franklinbaldo/papers commit or branch with the Few-NERD byte-channel pipeline"
        required: true
        default: "experiment/malecns-fewnerd-supervised"
      publish:
        description: "publish the full byte-channel cache to the Hugging Face dataset (needs HF_TOKEN secret)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: malecns-fewnerd-supervised-colab
  cancel-in-progress: false

jobs:
  run-fewnerd-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Configure Colab CLI
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          python -m pip install --disable-pip-version-check 'google-colab-cli==0.6.0' 'jupyter-kernel-client==0.9.0'
          if [[ -n "$COLAB_TOKEN_JSON" ]]; then
            install -d -m 700 "$HOME/.config/colab-cli"
            printf '%s' "$COLAB_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
            chmod 600 "$HOME/.config/colab-cli/token.json"
            echo "COLAB_AUTH_PROVIDER=oauth2" >> "$GITHUB_ENV"
          elif [[ -n "$COLAB_ADC_JSON" ]]; then
            printf '%s' "$COLAB_ADC_JSON" > "$RUNNER_TEMP/colab-adc.json"
            chmod 600 "$RUNNER_TEMP/colab-adc.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/colab-adc.json" >> "$GITHUB_ENV"
            echo "COLAB_AUTH_PROVIDER=adc" >> "$GITHUB_ENV"
          else
            echo "Missing GitHub secret COLAB_TOKEN_JSON (or COLAB_ADC_JSON)" >&2
            exit 2
          fi
      - name: Link live telemetry
        run: |
          group="gh-${{ github.run_id }}"
          url="https://wandb.ai/franklinbaldo-org/malecns-fewnerd/groups/${group}/workspace"
          {
            echo "## MaleCNS × Few-NERD supervised — live telemetry"
            echo "**[${url}](${url})**"
            echo "(Populates once the pipeline starts installing the experiment on Colab.)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "telemetry: ${url}"
      - name: Run Few-NERD stages on Colab
        env:
          COLAB_EXEC_TIMEOUT: "9000"
          HF_TOKEN: ${{ (github.event.inputs.publish == 'true') && secrets.HF_TOKEN || '' }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: franklinbaldo-org
          WANDB_PROJECT: malecns-fewnerd
          WANDB_RUN_GROUP: gh-${{ github.run_id }}
          PAPERS_REF: ${{ github.event.inputs.papers_ref || '' }}
        run: |
          mode="${{ github.event.inputs.mode || 'smoke' }}"
          export PAPERS_REF="${PAPERS_REF:-cd06570}"
          bash scripts/malecns-fewnerd/stages.sh \
            --output-dir "$RUNNER_TEMP/malecns-fewnerd" \
            --papers-ref "$PAPERS_REF" \
            --gpu T4 \
            --mode "$mode"
      - name: Summarize stages
        if: always()
        run: |
          summary="$RUNNER_TEMP/malecns-fewnerd/github-summary.json"
          [[ -f "$summary" ]] || { echo "missing Few-NERD summary" >&2; exit 0; }
          python - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('## MaleCNS × Few-NERD supervised — staged pipeline')
          print(f"- mode: **{d.get('mode')}** · papers ref `{d.get('papers_ref')}` · wall {d.get('wall_seconds',0):.0f}s")
          c=d.get('byte_cache',{})
          print(f"- byte cache: {c.get('sentences')} sentences, {c.get('bytes')} bytes, fingerprint `{c.get('fingerprint')}`")
          for e in c.get('encoders') or []:
              print(f"  - `{e['name']}` rev `{e.get('revision')}`: {e.get('encode_seconds',0):.0f}s, {e.get('bytes_per_second') or 0:.0f} bytes/s")
          if d.get('published'): print(f"- published: `{d['published'].get('repo')}` commit `{d['published'].get('commit')}`")
          r=d.get('reservoir',{})
          print(f"- reservoir: {r.get('docs_per_second') or 0:.1f} sentences/s, {r.get('chunks_per_second') or 0:.1f} bytes/s")
          p=d.get('probe',{})
          print(f"- probe: C={p.get('C')}, val_acc={p.get('val_accuracy')}, test token acc={p.get('test_token_accuracy')}")
          print(f"- **test micro-F1: {p.get('test_micro_f1')}**, macro-F1: {p.get('test_macro_f1')} ({p.get('test_sentences')} test sentences)")
          print(f"- claim status: {d.get('claim_status')}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: malecns-fewnerd-supervised-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-fewnerd
          if-no-files-found: warn
