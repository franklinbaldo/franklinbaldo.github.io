name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format and capture result
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git switch --force-create "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          set +e
          npx prettier --write src/components/Header.astro src/styles/music.css src/styles/tokens.css > .prettier-debug.log 2>&1
          FORMAT_STATUS=$?
          set -e
          {
            echo
            echo "prettier_exit=$FORMAT_STATUS"
          } >> .prettier-debug.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.astro src/styles/music.css src/styles/tokens.css .prettier-debug.log
          git commit -m "style: apply repository formatting and capture result"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$GITHUB_HEAD_REF"
