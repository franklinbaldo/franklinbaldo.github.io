name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-v24-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Astro build state
        uses: actions/cache@v4
        with:
          path: .astro
          key: ${{ runner.os }}-astro-v24-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-v24-

      - name: Repo hygiene
        run: npm run check:hygiene

      - name: Prettier check
        run: npx prettier --check .

      - name: Unit tests
        run: npm test

      - name: Hrönir doctor
        run: npm run hronir:doctor

      - name: Internal link check
        run: npm run check:links

      - name: Translation pairing check
        run: npm run check:translations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Astro type check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
