name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Repo hygiene
        run: npm run check:hygiene

      - name: Changelog and version check
        run: npm run check:changelog

      # Guards against phantom dependencies (imported but undeclared — works
      # today only because some other package pulls it in transitively and
      # npm flat-installs it into node_modules/, e.g. the `sharp` incident)
      # and dead dependencies (declared but unused). The --ignores list below
      # is for *verified* false positives depcheck's static import scanner
      # cannot see, not a place to silence real findings:
      #   - @fontsource/fraunces, @fontsource/inter, @picocss/pico: loaded via
      #     CSS @import (src/styles/*.css) or raw fs paths into node_modules
      #     (src/lib/og-card.ts), never a JS import.
      #   - dompurify, highlight.js, katex, marked, mermaid: only imported
      #     from .astro component frontmatter/script blocks — depcheck has no
      #     .astro parser (see "Special" in its README), so it can't see them.
      #   - pagefind: invoked as a CLI in the `build` script and its generated
      #     dist/pagefind assets are fetched by the browser at runtime via
      #     absolute URL, never imported as a JS module.
      #   - typescript: needed by depcheck's own TypeScript syntax support and
      #     by `astro check` / editor tooling, not directly imported anywhere.
      #   - @astrojs/check, @lhci/cli, tsx: CLI/loader tools invoked via
      #     `npx astro check`, `npx lhci autorun`, and `node --import tsx/esm`
      #     respectively — none are ever `import`ed.
      #   - depcheck: this step's own tool, invoked via npx — self-referential
      #     blind spot.
      #   - astro:content, astro:container: Astro virtual modules (content
      #     collections / Container API), not real npm packages, so they can
      #     never be "declared" in package.json.
      - name: Dependency check
        run: |
          npx depcheck --ignores="@fontsource/fraunces,@fontsource/inter,@picocss/pico,dompurify,highlight.js,katex,marked,mermaid,pagefind,typescript,@astrojs/check,@lhci/cli,depcheck,tsx,astro:content,astro:container"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate version selection
        run: npm run hronir:select

      - name: Hrönir doctor
        run: npm run hronir:doctor

      - name: Rate file deletion guard
        if: github.event_name == 'pull_request'
        run: |
          DELETED=$(git diff --diff-filter=D --name-only "origin/${{ github.base_ref }}..HEAD" -- '.routines/hronir/rates/')
          if [ -n "$DELETED" ]; then
            JUSTIFIED=$(git log --format=%s "origin/${{ github.base_ref }}..HEAD" | grep -c '^hronir: remove ' || true)
            if [ "$JUSTIFIED" -eq 0 ]; then
              echo "ERRO: Este PR deleta rate files existentes:"
              echo "$DELETED"
              echo ""
              echo "Rate files são imutáveis — nunca delete arquivos de sessões anteriores."
              echo "Se o doctor reportou erros, corrija apenas os arquivos que você criou nesta sessão."
              echo ""
              echo "Exceção: remoções justificadas (ex. rates contra uma versão publicada por"
              echo "engano) são permitidas se ao menos um commit do PR começar com 'hronir: remove '"
              echo "explicando o motivo."
              exit 1
            fi
            echo "Deleção de rate files justificada por commit 'hronir: remove ...':"
            echo "$DELETED"
          fi

      - name: Internal link check
        run: npm run check:links

      - name: Translation pairing check
        run: npm run check:translations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      # `astro check` roda seu próprio `sync()` (regeneração do content
      # layer) antes de tipar. Restaura (sem salvar — quem salva é o job
      # `build`, que já grava sob a mesma key) o mesmo cache `.astro/` do
      # job `build` pra esse sync não começar sempre frio; a cache do
      # Actions é remota por key, não por filesystem do runner, então os
      # dois jobs conseguem ler o mesmo blob mesmo rodando em paralelo.
      - name: Restore Astro build state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .astro
          key: ${{ runner.os }}-astro-v24-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-v24-

      - name: Astro type check
        run: npx astro check

  # Roda em paralelo ao job `check` acima (não depende dele) — build + pagefind
  # + Lighthouse são, de longe, a parte mais lenta do pipeline (~2min de build
  # sozinho localmente; bem mais no runner do CI, mais o Lighthouse em cima).
  # Rodavam em série no fim do job `check`, então PRs pagavam a soma dos dois;
  # como um não depende do resultado do outro, rodar em paralelo corta o
  # tempo de espera para o máximo dos dois em vez da soma. O trade-off: numa
  # PR que falha em lint/testes/etc, o build/Lighthouse ainda roda até o
  # fim (antes era abortado cedo) — aceitável aqui porque minutos de Actions
  # são de graça em repo público; o que importa é o tempo de espera.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PRs da rotina horária tocam só .routines/** (rate files + journal):
      # mudam dados de ranking, não a performance das páginas — nem o build
      # nem o Lighthouse têm o que pegar nelas (ver os gates abaixo). Usa
      # `...` (merge-base diff, isolando só os commits desta PR) de propósito
      # — não `..`, usado pelo passo "Rate file deletion guard" do job `check`
      # para um propósito diferente (deleção contra o main atual). Nota:
      # esta checagem é deliberadamente mais estreita que o SAFE_PREFIXES do
      # hronir-autopilot.yml — PRs de draft de edição (src/content/blog/**)
      # continuam de propósito fora daqui, porque mudam conteúdo real de
      # página e o Lighthouse deve auditá-las.
      - name: Classify PR scope
        id: scope
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^\.routines/'; then
            echo "routines_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "routines_only=false" >> "$GITHUB_OUTPUT"
          fi

      # Cache condicionado ao scope para não gravar um .astro vazio sob a
      # key exata do sha, o que roubaria do Deploy o restore-keys de um
      # build anterior quente.
      - name: Cache Astro build state
        if: steps.scope.outputs.routines_only != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .astro
          key: ${{ runner.os }}-astro-v24-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-v24-

      - name: Build
        if: steps.scope.outputs.routines_only != 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lighthouse lê ./dist (staticDistDir), então precisa do mesmo gate do
      # Build acima (ver Classify) — sem isso, rodaria contra um dist/ velho
      # ou inexistente em PRs que só tocam .routines/**.
      - name: Lighthouse CI
        if: steps.scope.outputs.routines_only != 'true'
        run: npx lhci autorun --config=.lighthouserc.cjs


  malecns-state-directed:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/malecns-state-directed-ci-run'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Preflight papers experiment
        run: |
          git clone --quiet --filter=blob:none https://github.com/franklinbaldo/papers.git "$RUNNER_TEMP/papers-state-directed"
          git -C "$RUNNER_TEMP/papers-state-directed" checkout --quiet 9ade5b651b8475028cc302b17c80c2c7464f658f
          python -m py_compile \
            "$RUNNER_TEMP/papers-state-directed/experiments/malecns_wifi/scripts/smoke_fully_state_conditioned_directed_plasticity_one_gpu.py" \
            "$RUNNER_TEMP/papers-state-directed/experiments/malecns_wifi/scripts/smoke_fully_state_conditioned_directed_plasticity_batch_gpu.py"

      - name: Restore exact semantic cache from preserved #460 run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/malecns-cache"
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/franklinbaldo/franklinbaldo.github.io/actions/artifacts/10405623856/zip \
            > "$RUNNER_TEMP/malecns-cache.zip"
          unzip -j "$RUNNER_TEMP/malecns-cache.zip" \
            semantic-cache.npz semantic-cache.manifest.json \
            -d "$RUNNER_TEMP/malecns-cache"
          python - "$RUNNER_TEMP/malecns-cache/semantic-cache.manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding="utf-8"))
          expected="37bf1fbaf59385ff4d37b667ed9a814db7bc12f6e47c41edcaab8d9a20c4612f"
          assert m.get("fingerprint")==expected, (m.get("fingerprint"), expected)
          print("semantic cache fingerprint:", expected)
          PY

      - name: Configure Colab CLI
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
        run: |
          python -m pip install --disable-pip-version-check 'google-colab-cli==0.6.0' 'jupyter-kernel-client==0.9.0'
          if [[ -n "$COLAB_TOKEN_JSON" ]]; then
            install -d -m 700 "$HOME/.config/colab-cli"
            printf '%s' "$COLAB_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
            chmod 600 "$HOME/.config/colab-cli/token.json"
            echo "COLAB_AUTH_PROVIDER=oauth2" >> "$GITHUB_ENV"
          elif [[ -n "$COLAB_ADC_JSON" ]]; then
            printf '%s' "$COLAB_ADC_JSON" > "$RUNNER_TEMP/colab-adc.json"
            chmod 600 "$RUNNER_TEMP/colab-adc.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/colab-adc.json" >> "$GITHUB_ENV"
            echo "COLAB_AUTH_PROVIDER=adc" >> "$GITHUB_ENV"
          else
            echo "Missing COLAB_TOKEN_JSON/COLAB_ADC_JSON" >&2
            exit 2
          fi

      - name: Run MaleCNS fully state-conditioned directed plasticity
        env:
          COLAB_EXEC_TIMEOUT: "10800"
        run: |
          bash scripts/malecns-fully-state-conditioned/colab.sh \
            --output-dir "$RUNNER_TEMP/malecns-state-directed" \
            --papers-ref "9ade5b651b8475028cc302b17c80c2c7464f658f" \
            --embedding-cache "$RUNNER_TEMP/malecns-cache/semantic-cache.npz" \
            --gpu T4

      - name: Summarize experiment
        run: |
          summary="$RUNNER_TEMP/malecns-state-directed/github-summary.json"
          [[ -f "$summary" ]] || { echo "missing summary" >&2; exit 1; }
          python - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print("## MaleCNS fully state-conditioned directed plasticity")
          print(f"- seeds: {d.get('seeds')}")
          for key,value in d.get("questions",{}).items():
              if isinstance(value,dict) and "mean_delta_unseen" in value:
                  print(f"- {key}: wins={value.get('wins_unseen')}/4; mean Δ unseen={value.get('mean_delta_unseen',0):+.6f}; mean Δ all={value.get('mean_delta_all',0):+.6f}")
          print(f"- gate collapse: {d.get('gate_collapse')}")
          print(f"- promotion checks: {d.get('promotion_checks')}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malecns-state-directed-${{ github.run_id }}
          path: ${{ runner.temp }}/malecns-state-directed
          if-no-files-found: error
          retention-days: 30
