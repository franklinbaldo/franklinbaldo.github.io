name: MaleCNS Exp1B Kaggle Logs

on:
  push:
    branches:
      - experiment/malecns-exp1b-session-opener
    paths:
      - ".github/workflows/malecns-exp1b-kaggle-logs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaggle-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Configure Kaggle CLI
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
        run: |
          [[ -n "$KAGGLE_API_TOKEN" ]] || { echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2; exit 2; }
          [[ -n "$KAGGLE_USERNAME" ]] || { echo "Missing GitHub variable KAGGLE_USERNAME" >&2; exit 2; }
          python -m pip install --disable-pip-version-check 'kaggle==2.2.4'
      - name: Capture current Kaggle run status and logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KERNEL_ID: franklinbaldo/malecns-multieurlex-exp-1b-public-session
        run: |
          set +e
          echo '=== KAGGLE STATUS ==='
          kaggle kernels status "$KERNEL_ID"
          echo '=== KAGGLE STREAM LOG ==='
          kaggle kernels logs "$KERNEL_ID"
          logs_rc=$?
          echo "logs_rc=$logs_rc"
          echo '=== KAGGLE OUTPUT DOWNLOAD ==='
          mkdir -p "$RUNNER_TEMP/kaggle-output"
          kaggle kernels output "$KERNEL_ID" -p "$RUNNER_TEMP/kaggle-output" -o
          output_rc=$?
          echo "output_rc=$output_rc"
          echo '=== OUTPUT FILES ==='
          find "$RUNNER_TEMP/kaggle-output" -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort
          echo '=== TEXT OUTPUT CONTENTS ==='
          while IFS= read -r f; do
            case "$f" in
              *.log|*.txt|*.json|*.out|*.err)
                echo "----- $f -----"
                sed -n '1,2000p' "$f"
                ;;
            esac
          done < <(find "$RUNNER_TEMP/kaggle-output" -maxdepth 2 -type f | sort)
          exit 0
