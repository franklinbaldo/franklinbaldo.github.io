schema: audiobook-voices-v1
work_id: hpmor
default_locale: pt-BR
voices:
  narrator:
    role: narrator
    description: Voz narrativa principal; clara, controlada e capaz de sustentar passagens analíticas longas sem soar didática demais.
    kokoro:
      voice: pm_alex
      speed: 1.0
  harry:
    role: character
    description: Menino muito articulado e intelectualmente precoce; energia juvenil sem transformar a voz em caricatura infantil.
    kokoro:
      voice:
        - { name: pm_alex, weight: 0.6 }
        - { name: bm_fable, weight: 0.4 }
      speed: 1.12
  michael:
    role: character
    description: Professor adulto, racionalista e formal; dicção precisa, ceticismo seco e autocontrole. Mesmo sob tensão, evitar gritos ou caricatura de autoridade; a incredulidade deve aparecer mais pela precisão e contenção do que por volume.
    kokoro:
      voice:
        - { name: pm_santa, weight: 0.7 }
        - { name: am_onyx, weight: 0.3 }
      speed: 0.96
  petunia:
    role: character
    description: Adulta, afetiva e emocionalmente transparente, mas não frágil por padrão; voz natural e doméstica, capaz de mostrar medo, insistência e vulnerabilidade sem melodrama. Em confronto com Michael, preservar firmeza mesmo quando assustada e evitar transformar tensão em choro ou grito sem indicação textual.
    kokoro:
      voice:
        - { name: pf_dora, weight: 0.7 }
        - { name: af_nicole, weight: 0.3 }
      speed: 0.96
  mcgonagall:
    role: character
    description: Adulta, autoridade contida, precisão e firmeza; emoção deve aparecer sem perder compostura.
    kokoro:
      voice:
        - { name: pf_dora, weight: 0.7 }
        - { name: af_nicole, weight: 0.3 }
      speed: 0.94
  fallback_male:
    role: fallback
    description: Fallback provisório para personagem masculino ainda sem direção individual.
    kokoro:
      voice: pm_alex
      speed: 1.0
  fallback_female:
    role: fallback
    description: Fallback provisório para personagem feminino ainda sem direção individual.
    kokoro:
      voice: pf_dora
      speed: 1.0
  mixed:
    role: fallback
    description: Unidade editorial contendo alternância de vozes com partição pendente.
    kokoro:
      voice: pm_alex
      speed: 1.0
