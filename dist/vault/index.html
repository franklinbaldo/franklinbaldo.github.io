<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px 16px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      min-height: 100vh;
    }
    h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--tg-theme-text-color, #000);
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--tg-theme-hint-color, #888);
      margin-bottom: 6px;
    }
    input {
      display: block;
      width: 100%;
      padding: 11px 13px;
      font-size: 15px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 10px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      outline: none;
      margin-bottom: 16px;
      -webkit-appearance: none;
    }
    input:focus { border-color: var(--tg-theme-button-color, #2481cc); }
    button {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
    }
    button:active { opacity: .8; }
    button:disabled { opacity: .5; cursor: default; }
    #status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      color: var(--tg-theme-hint-color, #888);
      min-height: 18px;
    }
    #status.err { color: #e53935; }
    #status.ok  { color: #43a047; }
  </style>
</head>
<body>
  <h3>🔐 Salvar Segredo</h3>
  <label>Nome</label>
  <input id="n" type="text" placeholder="MINHA_API_KEY" autocomplete="off" spellcheck="false">
  <label>Valor</label>
  <input id="v" type="password" placeholder="sk-..." autocomplete="new-password">
  <button id="btn" onclick="save()">Salvar</button>
  <div id="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Pre-fill name field with timestamp
    const pad = n => String(n).padStart(2, '0');
    const d = new Date();
    const nField = document.getElementById('n');
    nField.value = 'CHAVE_' + d.getFullYear()
      + pad(d.getMonth() + 1) + pad(d.getDate())
      + '_' + pad(d.getHours()) + pad(d.getMinutes());
    nField.select();

    // Backend URL from query param: ?backend=https://xxx.trycloudflare.com
    const backend = new URLSearchParams(window.location.search).get('backend') || '';

    function status(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls || '';
    }

    async function save() {
      const name = nField.value.trim().toUpperCase();
      const value = document.getElementById('v').value.trim();
      if (!name || !value) { tg.showAlert('Preencha ambos os campos.'); return; }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      status('Salvando...');

      // If no backend URL, fall back to sendData (reply_keyboard mode)
      if (!backend) {
        tg.sendData(JSON.stringify({ name, value }));
        return;
      }

      try {
        const res = await fetch(backend + '/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, value, initData: tg.initData }),
        });
        const data = await res.json();
        if (data.ok) {
          status('✔ Salvo!', 'ok');
          setTimeout(() => tg.close(), 1200);
        } else {
          status('Erro: ' + (data.error || 'desconhecido'), 'err');
          btn.disabled = false;
        }
      } catch (e) {
        status('Falha de conexão: ' + e.message, 'err');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
