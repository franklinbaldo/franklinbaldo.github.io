<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="0.5">
  <!-- Cobogó tile: circles inscribed in a grid. Real cobogós are
       pierced with circular holes only — no diagonal cross-members. -->
  <rect x="0" y="0" width="60" height="60" fill="none" />
  <rect x="60" y="0" width="60" height="60" fill="none" />
  <rect x="0" y="60" width="60" height="60" fill="none" />
  <rect x="60" y="60" width="60" height="60" fill="none" />
  <circle cx="30" cy="30" r="22" />
  <circle cx="90" cy="30" r="22" />
  <circle cx="30" cy="90" r="22" />
  <circle cx="90" cy="90" r="22" />
</svg>
