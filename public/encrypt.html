*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Mono',Monaco,'Cascadia Code',monospace;background:#0a0a0a;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:560px;width:100%;background:#141414;border:1px solid #222;border-radius:12px;padding:32px}
h1{font-size:1.3em;margin-bottom:4px;color:#fff}
.sub{color:#666;font-size:.85em;margin-bottom:24px}
label{display:block;font-size:.8em;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:12px;color:#fff;font-family:inherit;font-size:.9em;resize:vertical;outline:none;transition:border-color .2s}
textarea:focus{border-color:#4a9eff}
#input{height:80px;margin-bottom:16px}
#output{height:160px;margin-bottom:12px}
button{width:100%;padding:12px;border:none;border-radius:8px;font-family:inherit;font-size:.9em;font-weight:600;cursor:pointer;transition:all .2s}
#encryptBtn{background:#4a9eff;color:#fff;margin-bottom:12px}
#encryptBtn:hover{background:#3a8eef}
#encryptBtn:disabled{background:#333;color:#666;cursor:not-allowed}
#copyBtn{background:#222;color:#aaa;display:none}
#copyBtn:hover{background:#333;color:#fff}
#telegramBtn{background:#2AABEE;color:#fff;display:none;margin-top:8px}
#telegramBtn:hover{background:#229ED9}
.status{text-align:center;font-size:.8em;margin-top:8px;height:20px;color:#4a9eff}
.fingerprint{font-size:.7em;color:#444;margin-top:16px;text-align:center;word-break:break-all}

<textarea id="input" placeholder="Cole aqui o que quer criptografar..."></textarea>

<button id="encryptBtn" onclick="encrypt()">🔒 Criptografar</button>

<label for="output">Mensagem Criptografada</label>
<textarea id="output" readonly placeholder="O resultado aparece aqui..."></textarea>

<button id="copyBtn" onclick="copyResult()">📋 Copiar</button>
<button id="telegramBtn" onclick="sendTelegram()">✈️ Enviar pro Funes no Telegram</button>

<div class="status" id="status"></div>

async function encrypt() {
  const input = document.getElementById('input').value.trim();
  if (!input) return;

  const btn = document.getElementById('encryptBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'Criptografando...';

  try {
    const publicKey = await openpgp.readKey({ armoredKey: PUBLIC_KEY });
    const encrypted = await openpgp.encrypt({
      message: await openpgp.createMessage({ text: input }),
      encryptionKeys: publicKey,
    });
    document.getElementById('output').value = encrypted;
    document.getElementById('copyBtn').style.display = 'block';
    document.getElementById('telegramBtn').style.display = 'block';
    status.textContent = '✅ Pronto! Envie pro Funes.';
  } catch (e) {
    status.textContent = '❌ Erro: ' + e.message;
  }
  btn.disabled = false;
}

async function copyResult() {
  const output = document.getElementById('output');
  await navigator.clipboard.writeText(output.value);
  document.getElementById('status').textContent = '📋 Copiado!';
}

function sendTelegram() {
  const text = document.getElementById('output').value;
  const encoded = encodeURIComponent(text);
  window.open('https://t.me/share/url?text=' + encoded, '_blank');
}
